openapi: 3.1.0
info:
  title: OpenPak Mobile API
  version: 1.0.0
  summary: Companion-app API served by the OpenPak website.
  description: |
    Versioned surface under `/api/v1` (PRD WEB-08). Bearer tokens are minted
    from a core web session: the server establishes the session through the
    account core's public HTTP contract and binds a random bearer to it.
    Revoking the underlying session (logout, ban, password reset) ends
    bearer validity within the core's revocation window. Rate limits: 10
    token mints per minute per client, 120 calls per minute per token.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://openpak.org/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Development
security:
  - bearerAuth: []
paths:
  /token:
    post:
      summary: Mint a bearer token from account credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Revoke the presented token (ends the core session too)
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /status:
    get:
      summary: Who is online, per title and per console network
      security: []
      description: |
        Public: no bearer. The people most likely to check status are the ones
        whose sign-in is the part that is broken.

        Counts are distinct accounts, taken from the same live session leases a
        friends list reads, so this can never disagree with presence. Someone
        playing two titles is one player in `players_online` and one player on
        their network, while appearing under both titles.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  players_online: { type: integer }
                  titles:
                    type: array
                    items:
                      type: object
                      properties:
                        title_id: { type: string, examples: ["0100ED9024EB8000"] }
                        namespace: { type: string, examples: ["switch"] }
                        players: { type: integer }
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        namespace: { type: string, examples: ["switch"] }
                        players: { type: integer }
        "502": { description: The account core could not be reached. }
  /me:
    get:
      summary: Account projection with friend code and linked platforms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions:
    get:
      summary: List live core web sessions (devices)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{id}:
    delete:
      summary: Revoke one session (pass the token's own id to sign out)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friends:
    get:
      summary: Accepted friends
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/invitations:
    get:
      summary: Invitations waiting for this account
      description: |
        A read of the account's pending invitations across every adapter
        namespace. Non-consuming: it starts no redelivery window and marks
        nothing delivered, so opening an inbox on a phone cannot take an
        invitation away from the console that has to receive it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/invitations/decline:
    post:
      summary: Decline an invitation
      description: |
        Declines an invitation addressed to this account. Declining one that is
        already gone — expired, delivered, or never theirs — answers
        `declined: false` rather than failing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  declined: { type: boolean }
        "400": { description: invitation_id is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/profile:
    post:
      summary: Edit the account's profile
      description: |
        Every field is optional and an empty one is left unchanged, so a screen
        that edits one thing sends one thing. Validation lives in the account
        core: a two-letter country, an ISO date, a display name of 3 to 32
        characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 3, maxLength: 32 }
                country: { type: string, minLength: 2, maxLength: 2, examples: ["IE"] }
                birthday: { type: string, format: date, examples: ["1990-01-01"] }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
        "400": { description: The core rejected a value; the message says which. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /regions:
    get:
      summary: The region nodes a room may be served from
      security: []
      description: |
        Public. Approved federation nodes that announced within the last few
        minutes, with the addresses they run (`services`, e.g. `photon`,
        `npln_relay`, `turn`) and how many people are on them. Matchmaking
        stays at home; a host's room is placed on the node for their country
        and joiners are sent there by the room itself.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: ["au-sydney"] }
                        name: { type: string }
                        country: { type: string, examples: ["AU"] }
                        services:
                          type: object
                          additionalProperties: { type: string }
                        players: { type: integer }
                        last_seen_unix: { type: integer }
        "503": { description: Federation is not configured on this deployment. }
  /federation/announce:
    post:
      summary: A region node announces its addresses
      security: []
      description: |
        Called by a node about once a minute with its own key as the bearer
        (`Authorization: Bearer opnode_...`). Replaces the node's advertised
        services and marks it seen. A node that stops announcing drops out of
        `/regions` after three minutes; an unapproved node is accepted here
        and listed nowhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: object
                  additionalProperties: { type: string }
                  examples: [{ photon: "203.0.113.9:22002", npln_relay: "203.0.113.9:21010" }]
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  approved: { type: boolean }
        "401": { description: No node key, or one the core does not know. }
  /network/profile:
    get:
      summary: The OpenPak network profile — what to redirect, and where
      security: []
      description: |
        Generated from the routing this server actually runs (PRD
        website/prds/network-profile-service-prd.md), so adding a title is a server deploy,
        not six client releases. One conditional GET per launch: send
        `If-None-Match` with the stored ETag and an unchanged profile is a
        304. Public, identical for everyone, no credentials.

        The client's own compiled-in allowlist stays the ceiling: the server
        may narrow, never widen, and a profile entry outside that allowlist
        is dropped and logged client-side.
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [switch, wiiu, 3ds, wii, ds]
          description: |
            Omitted means every platform united — what a diagnostic or the
            website itself wants and no emulator does.
      responses:
        "200":
          description: The current profile for the platform
          headers:
            ETag:
              description: Strong entity tag; echo it in If-None-Match
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProfile"
        "304":
          description: Unchanged; the stored profile is still current
          headers:
            ETag:
              schema: { type: string }
        "400": { description: Unknown platform. }
        "503": { description: Profiles not configured on this deployment. }
  /network/ca.pem:
    get:
      summary: The console CA the profile pins
      security: []
      description: |
        The PEM of the CA console-facing certificates chain to, published
        under the profile's `ca.url` and pinned by its `ca.sha256` — a
        profile cannot swap the trust anchor without the hash changing.
        A client bootstraps trust from nothing but openpak.org: fetch the
        profile, fetch this, check the digest before trusting it.
      responses:
        "200":
          description: The CA, PEM-encoded
          headers:
            ETag:
              schema: { type: string }
            X-CA-Sha256:
              description: The same digest the profile's `ca.sha256` carries
              schema: { type: string }
          content:
            application/x-pem-file:
              schema: { type: string }
        "304": { description: Unchanged. }
        "404": { description: No CA available on this deployment. }
        "503": { description: Profiles not configured on this deployment. }
  /requests:
    get:
      summary: The votable catalogue (titles and network features)
      security: []
      description: |
        The same request/vote scoreboard the website shows. Each item carries a
        live vote count. Auth is optional: `voted` is false when the request is
        unauthenticated, and reflects the caller's own votes when a valid bearer
        is sent. Returns every item; the client filters and sorts. `kind`
        narrows to titles or features.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [title, feature] }
          description: Restrict to titles or features; omit for both.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, examples: [42] }
                        kind: { type: string, examples: ["title"] }
                        name: { type: string, examples: ["Tetris 99"] }
                        console: { type: string, examples: ["Switch"] }
                        category: { type: string }
                        backend: { type: string }
                        status: { type: string, examples: ["requestable"] }
                        notes: { type: string }
                        votes: { type: integer }
                        voted: { type: boolean }
  /requests/{id}/vote:
    post:
      summary: Toggle the caller's vote on a request
      description: |
        Idempotent per account: voting an item you already voted for removes the
        vote. Returns the request's fresh count and the caller's new state.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: The request id from GET /requests.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  votes: { type: integer }
                  voted: { type: boolean }
        "400": { description: Missing or unknown request id. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "The request is not votable (a live/beta game, or a feature); no vote is recorded." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /avatars:
    get:
      summary: The built-in avatars
      description: |
        The same set the website offers, so a client shows what exists rather
        than a hardcoded list that drifts. `url` is relative to the site and
        immutable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatars:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: ["aurora"] }
                        url: { type: string, examples: ["/media/avatars/preset/aurora"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/avatar:
    post:
      summary: Choose a built-in avatar
      description: |
        Uploading a photo stays on the website, where the multipart handling,
        size limit and rate limit already live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { type: string, examples: ["aurora"] }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
        "400": { description: preset is required, or is not one of the built-ins }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Avatars are not configured on this deployment. }
  /me/push:
    post:
      summary: Register this install for notifications
      description: |
        Records the device token this install can be reached at. Keyed by the
        token, so the same phone signing in as a different account moves the
        registration rather than leaving the previous account's notifications
        arriving on it.

        Delivery is through FCM, which reaches Android directly and iOS via
        APNs. iOS therefore also needs an APNs key uploaded to the Firebase
        project; without one, iOS installs register successfully and receive
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The transport's device token. }
                platform:
                  type: string
                  default: fcm
                  description: Which transport the token belongs to.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: boolean }
        "400": { description: token is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Stop notifying this install
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten: { type: boolean }
        "400": { description: token is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/requests:
    get:
      summary: Pending incoming and outgoing friend requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incoming:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
                  outgoing:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Send a friend request by friend code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_code]
              properties:
                friend_code:
                  type: string
                  description: Display form (SW-xxxx-xxxx-xxxx) or bare subject.
                  examples: ["SW-0123-4567-89ab"]
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  account_id: { type: string }
        "400": { description: Cannot befriend yourself }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No account for that friend code }
        "409": { description: Conflicting relationship state }
  /me/friends/requests/accept:
    post:
      summary: Accept a pending incoming request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountIDBody"
      responses:
        "200": { description: Friend added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: No pending request }
  /me/friends/remove:
    post:
      summary: Remove a friendship or decline a pending request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/block:
    post:
      summary: Block an account (durable, directional)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Blocked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/unblock:
    post:
      summary: Remove a block
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Unblocked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /titles/{title_id}/mods:
    get:
      summary: Published mods for a title (served by the mods service)
      parameters: [{ name: title_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Manifest: id, slug, version, sha256, size, licence, summary, package_url" }
  /mods/{id}:
    get:
      summary: One mod entry
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The entry }
        "404": { description: Not published }
  /mods/{id}/package:
    get:
      summary: The mod package (zip); ETag is the sha256, honours If-None-Match
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: application/zip }
        "304": { description: Unchanged }
        "404": { description: Not published }
  /submissions:
    post:
      summary: Submit a mod package (multipart field "package") for curation
      responses:
        "202": { description: Accepted into the queue }
        "422": { description: Refused by the provenance gate, with the reason }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/submissions:
    get:
      summary: The caller's submissions and their status
      responses:
        "200": { description: List }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/favourites:
    get:
      summary: The caller's favourite mods
      responses:
        "200": { description: List }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/favourites/{id}:
    put:
      summary: Favourite a mod
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Unfavourite a mod
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/wiiu:
    get:
      summary: The account's Wii U identity (PNID, NEX credentials, Mii), minted on first sight
      responses:
        "200": { description: "account_id, pid, username, nex_password, mii_name, mii_data, device_type" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
  /me/3ds:
    get:
      summary: The account's 3DS identity (PNID, NEX credentials, friend code, Mii), minted on first sight
      responses:
        "200": { description: "account_id, pid, username, friend_code, nex_password, mii_name, mii_data, device_type" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from POST /token.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Opaque bearer value; store securely, never log it.
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        message: { type: string }
    NetworkProfile:
      type: object
      description: |
        PRD prds/network-profile-service-prd.md §4. `version` is for humans and logs;
        the ETag is the machine's answer. `recheck_after` is a hint the
        client may honour or ignore. Validation before applying is the
        client's job: reject the whole profile unless it arrived over HTTPS
        from openpak.org and every entry sits inside the compiled-in
        allowlist.
      required: [version, generated_at, platform, server, redirect, services, recheck_after]
      properties:
        version: { type: integer, description: Monotonic; bumps when anything below changes. }
        generated_at: { type: integer, description: Unix seconds. }
        platform:
          type: string
          description: The requested platform, or "all" for the union.
        server:
          type: object
          required: [address, https_port, http_port]
          properties:
            address: { type: string, description: What a redirected name resolves to. }
            https_port: { type: integer }
            http_port: { type: integer }
        ca:
          type: [object, "null"]
          description: Absent when no CA is available; the client keeps the one it pinned.
          properties:
            url: { type: string }
            sha256: { type: string, description: Hex digest of the PEM at ca.url. }
            not_after: { type: integer, description: Unix seconds; CA expiry. }
        redirect:
          type: object
          required: [suffixes, exact, never]
          properties:
            suffixes:
              type: array
              items: { type: string }
              description: Domain families to redirect; a subset of the client's compiled-in families.
            exact:
              type: array
              items: { type: string }
              description: Names outside every listed suffix family.
            never:
              type: array
              items: { type: string }
              description: Names that must reach the real internet — a connection test pointed at OpenPak measures OpenPak.
        services:
          type: array
          description: For clients that address a URL rather than resolve a name (Cemu). DNS-redirecting clients ignore it.
          items:
            type: object
            required: [id, url]
            properties:
              id: { type: string }
              url: { type: string }
        recheck_after: { type: integer, description: Seconds; a hint, not a contract. }
    Error:
      type: object
      properties:
        error: { type: string }
    Account:
      type: object
      properties:
        account_id: { type: string }
        display_name: { type: string }
        country: { type: string, description: Empty when the account has never set one. }
        birthday: { type: string, description: Empty when the account has never set one. }
        avatar_url:
          type: ['string', 'null']
          description: |
            Relative to the site. Null when the account has never chosen an
            avatar, so a client shows its own fallback rather than a broken
            image.
        friend_code:
          type: [string, "null"]
          description: Present only when a console link exists (CR-3 projection).
        linked_platforms:
          type: array
          items:
            type: object
            properties:
              namespace: { type: string }
              link_id: { type: string }
    Session:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Friend:
      type: object
      required: [account_id, display_name, online]
      properties:
        account_id: { type: string }
        display_name: { type: string }
        online:
          type: boolean
          description: |
            Whether this friend holds a live session right now. Presence is
            derived from that session's lease, so it cannot drift out of step
            with it. The remaining fields are present only when `online` is
            true; presence is best-effort, and a friends list still loads with
            everyone shown offline if presence cannot be read.
        title_id:
          type: string
          description: What they are playing. Absent when the adapter registered no title.
        namespace:
          type: string
          description: The adapter the live session belongs to, e.g. `switch`.
          examples: ["switch"]
        since:
          type: string
          format: date-time
          description: When the session was registered.
      examples:
        - account_id: "3f1c…"
          display_name: "Leia"
          online: true
          title_id: "0100E65002BB8000"
          namespace: "switch"
          since: "2026-09-08T09:15:00Z"
    Invitation:
      type: object
      required: [invitation_id, from, title_id, namespace, expires_at]
      properties:
        invitation_id: { type: string }
        from:
          type: string
          description: Display name of the account that sent it.
        title_id: { type: string }
        namespace: { type: string, examples: ["switch"] }
        expires_at: { type: string, format: date-time }
      description: |
        Deliberately carries no payload and no nonce: both belong to the adapter
        that has to deliver the invitation to a console, and reading this inbox
        never consumes an invitation or interferes with that delivery.
    DeclineBody:
      type: object
      required: [invitation_id]
      properties:
        invitation_id: { type: string }
    AccountIDBody:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
