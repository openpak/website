openapi: 3.1.0
info:
  title: OpenPak Mobile API
  version: 1.0.0
  summary: Companion-app API served by the OpenPak website.
  description: |
    Versioned surface under `/api/v1` (PRD WEB-08). Bearer tokens are minted
    from a core web session: the server establishes the session through the
    account core's public HTTP contract and binds a random bearer to it.
    Revoking the underlying session (logout, ban, password reset) ends
    bearer validity within the core's revocation window. Rate limits: 10
    token mints per minute per client (register, forgot-password, the 2FA
    step and email confirmation share it), 120 calls per minute per token,
    and 120 per minute per client for the public title catalogue and news.

    One host, several services: the mods routes (tagged `x-served-by: mods`)
    are routed by Traefik to the mods service; everything else is the website.
    Outside this base URL: `GET /ca.pem` (the OpenPak CA) is served by the
    website at the root, and `/api/v2/network/*` (build-time network policy
    distribution) is the registry service's, documented in docs/registry.md.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://openpak.org/api/v1
    description: Production
  - url: http://localhost:20010/api/v1
    description: Development
security:
  - bearerAuth: []
paths:
  /token:
    post:
      summary: Mint a bearer token from account credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      description: |
        An account with two-factor authentication answers 202 with a challenge
        and no token; redeem it at `POST /token/2fa` with a code from the
        authenticator app or a recovery code. A closed (deleted) account that
        is still within its 30-day grace period answers 409
        `account_deletion_pending` with `erase_after`, and only to the right
        password: offer the restore (`POST /token/restore`).
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "202":
          description: Password right; a second factor is owed (no token yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/DeletionPending" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Revoke the presented token (ends the core session too)
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /token/restore:
    post:
      summary: Restore a closed account and mint the bearer
      security: []
      description: |
        Reopens an account closed within its grace period (the password is the
        proof, as for `POST /token`), then answers exactly like `POST /token`:
        201 with a token, or 202 with a challenge for a two-factor account. An
        account that is not closed simply signs in. Shares the token-minting
        rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201":
          description: Restored and token minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "202":
          description: Restored; a second factor is owed (no token yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account is suspended (a restore keeps a suspension).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The grace period is over (`account_erasure_started`); the account is being erased.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /token/2fa:
    post:
      summary: Finish a two-factor sign-in and mint the bearer
      security: []
      description: |
        Send the challenge from `POST /token` with either `code` (six digits
        from the authenticator app) or `recovery_code` (single use). A
        challenge lasts 10 minutes and dies after 5 wrong codes; after 5 wrong
        codes in 15 minutes the account's second factor is locked (429). Shares
        the token-minting rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string }
                code: { type: string, examples: ["123456"] }
                recovery_code: { type: string, examples: ["abcde-fghij"] }
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: The challenge, or both codes, are missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Wrong code, or the challenge is spent; sign in again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TwoFactorLocked" }
        "502": { description: The account core did not answer. }
  /status:
    get:
      summary: Who is online, per title and per console network
      security: []
      description: |
        Public: no bearer. The people most likely to check status are the ones
        whose sign-in is the part that is broken.

        Counts are distinct accounts, taken from the same live session leases a
        friends list reads. Someone
        playing two titles is one player in `players_online` and one player on
        their network, while appearing under both titles.

        Only titles in the website's database appear in `titles`. Unknown apps
        still count toward `players_online` and their network's online count.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  players_online: { type: integer }
                  titles:
                    type: array
                    items:
                      type: object
                      properties:
                        title_id: { type: string, examples: ["0100ED9024EB8000"] }
                        namespace: { type: string, examples: ["switch"] }
                        players: { type: integer }
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        namespace: { type: string, examples: ["switch"] }
                        players: { type: integer }
        "502": { description: The account core could not be reached. }
  /me:
    get:
      summary: Account projection with friend code and linked platforms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Delete the account
      description: |
        Needs the password again, so a bearer on its own cannot end the
        account. An account with two-factor authentication also needs a
        current code or a recovery code (`code` or `recovery_code`); without
        one the answer is 403 with `two_factor_required: true`. The core
        closes the account at once and revokes every session; every bearer
        of the account, this one included, stops working. For 30 days signing
        in offers a restore (`POST /token/restore`); after that the account is
        erased in every service automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                code: { type: string, description: "Authenticator code, or a recovery code." }
                recovery_code: { type: string }
      responses:
        "200":
          description: Deletion started
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "400": { description: password is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong password or code, or a code is owed; nothing was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  two_factor_required: { type: boolean, description: Set when the account needs a code and none was sent. }
        "429": { $ref: "#/components/responses/TwoFactorLocked" }
  /me/sessions:
    get:
      summary: List live core web sessions (devices)
      description: Each session carries `current`, true for the one this bearer is bound to (the app's "this device").
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{id}:
    delete:
      summary: Revoke one session (pass the token's own id to sign out)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friends:
    get:
      summary: Accepted friends
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/invitations:
    get:
      summary: Invitations waiting for this account
      description: |
        A read of the account's pending invitations across every adapter
        namespace. Non-consuming: it starts no redelivery window and marks
        nothing delivered, so opening an inbox on a phone cannot take an
        invitation away from the console that has to receive it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/parental-controls:
    get:
      summary: The consoles this account manages
      description: |
        Parental controls, parent side. The records live with nx-baas because the
        console asks it for them over its own API; this is the read the OpenPak
        app lists. A `pairing_code` appears only while it is still live — an
        expired code on a screen is worse than none, because someone types it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/ParentalDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/pairing:
    post:
      summary: Mint a pairing code to type on a console
      description: |
        Creates the device record a console adopts and returns the code to enter
        in System Settings → Parental Controls. Not idempotent: asking again is
        how someone who walked away from the console gets a fresh code.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentalPairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/{moonID}/pin:
    get:
      summary: One console's PIN
      description: |
        The PIN the console asks for. It is never in the device list: the app
        fetches it only when it is shown, behind the phone's own unlock. Present
        once the console has reported it (at pairing, or in a sync receipt).
        Answered with `Cache-Control: no-store`, and never logged.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unlock_code]
                properties:
                  unlock_code: { type: string, description: Four to eight digits. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: the console has not reported its PIN, or it is not one this account manages }
        "503": { description: parental controls are not configured on this deployment }
    put:
      summary: Give the console a new PIN
      description: |
        Exactly four digits: the console's entry field has four places. The
        console takes it at its next sync; until then the old PIN is the one
        that works on it. Answered with `Cache-Control: no-store`; the body is
        never logged.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unlock_code]
              properties:
                unlock_code: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "204": { description: stored }
        "400": { description: "not four digits (code `invalid_pin`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: not a console this account manages }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/{moonID}/players/{playerID}/image:
    get:
      summary: A player's picture
      description: The JPEG the console uploaded for one of its users.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
        - { name: playerID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            image/jpeg: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: no such picture, or the console is not one this account manages }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/unlock:
    post:
      summary: Check the account password before opening the parental screens
      description: |
        For a device that cannot ask for its own unlock. Answers whether the
        password is this account's, and nothing else: no token, no state. A
        second factor is not asked for. Five tries per account per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: the password is this account's }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "wrong password (code `wrong_password`)" }
        "429": { description: "too many tries (code `rate_limited`)" }
  /me/parental-controls/{moonID}:
    delete:
      summary: Remove a console from this account's list
      description: |
        The console is not told: it stays linked on its own side until it is
        unlinked there, in System Settings → Parental Controls, with the PIN.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: not a console this account manages }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/{moonID}/setting:
    put:
      summary: Replace the setting document the console is served
      description: |
        The whole document, as `GET /me/parental-controls` served it with the
        parent's changes applied: keys the client does not edit (the per-title
        entries a console reports, for one) must be sent back as they came, or
        they are gone. Anything the console's parse table would not take is
        refused with the key it names, and nothing is stored. The console picks
        the document up at its next sync; `synced` in the list turns true when
        its receipt names the new ETag.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting]
              properties:
                setting: { type: object, additionalProperties: true }
      responses:
        "200":
          description: stored
          content:
            application/json:
              schema:
                type: object
                required: [etag, updated_at]
                properties:
                  etag: { type: string, description: The ETag the console will be served. }
                  updated_at: { type: integer, format: int64, description: Unix seconds. }
        "400":
          description: "the console could not take it (code `invalid_setting`)"
          content:
            application/json:
              schema:
                type: object
                required: [error, code, path]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [invalid_setting] }
                  path:
                    type: string
                    description: The refused key, dotted from the document's root, e.g. `customSettings.ageRestriction.ratingAge`; empty when the body had no setting.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: not a console this account manages }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/{moonID}/name:
    put:
      summary: Name a console
      description: |
        The parent's name for a console, so two under one account can be told
        apart. It stays with OpenPak: the console never sends or receives a
        name. Surrounding whitespace is trimmed; an empty name clears it, and
        the list then shows the console by the end of its serial number.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: At most 32 characters (not bytes), no control characters. }
      responses:
        "204": { description: stored }
        "400": { description: "over 32 characters or with control characters (code `invalid_name`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: not a console this account manages }
        "502": { description: "the parental-controls service cannot store names yet (code `service_unavailable`)" }
        "503": { description: parental controls are not configured on this deployment }
  /me/parental-controls/{moonID}/activity:
    get:
      summary: Time used per day and per title
      description: |
        The console's own play-timer count, newest day first; a day with no
        time used is left out. `total_minutes` includes the HOME menu, so it
        can be more than the titles add up to, and `titles` can be empty.
        `name` comes from the titles catalogue and is absent for a title it
        does not know. Each title also says who played it.
      parameters:
        - { name: moonID, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 7 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, total_minutes, titles]
                      properties:
                        date: { type: string, format: date }
                        total_minutes: { type: integer }
                        titles:
                          type: array
                          items:
                            type: object
                            required: [title_id, minutes, players, anonymous_minutes]
                            properties:
                              title_id: { type: string }
                              name: { type: string }
                              minutes: { type: integer }
                              players:
                                type: array
                                description: |
                                  The title's time by the console's own users, most first; empty
                                  when the console did not split it. `nickname` comes from the
                                  console's player list and is absent for a user it no longer
                                  lists. A picture is `…/players/{id}/image`.
                                items:
                                  type: object
                                  required: [id, minutes]
                                  properties:
                                    id: { type: string }
                                    nickname: { type: string }
                                    minutes: { type: integer }
                              anonymous_minutes: { type: integer, description: Time played with no user selected. }
        "400": { description: "days outside 1 to 30 (code `bad_request`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: not a console this account manages }
        "503": { description: parental controls are not configured on this deployment }
  /me/invitations/decline:
    post:
      summary: Decline an invitation
      description: |
        Declines an invitation addressed to this account. Declining one that is
        already gone — expired, delivered, or never theirs — answers
        `declined: false` rather than failing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  declined: { type: boolean }
        "400": { description: invitation_id is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/profile:
    post:
      summary: Edit the account's profile
      description: |
        Every field is optional and an empty one is left unchanged, so a screen
        that edits one thing sends one thing. Validation lives in the account
        core: a two-letter country, an ISO date, a display name of 3 to 32
        characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 3, maxLength: 32 }
                country: { type: string, minLength: 2, maxLength: 2, examples: ["IE"] }
                birthday: { type: string, format: date, examples: ["1990-01-01"] }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
        "400": { description: The core rejected a value; the message says which. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/password:
    post:
      summary: Change the account's password
      description: |
        The core checks the current password and revokes the account's other
        sessions, and with them every other bearer. This token stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
        "400": { description: "A field is missing, or the core rejected the change; the message says why." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/links/wfc:
    post:
      summary: Link a Wii or DS by friend code
      description: |
        WFC has no login, so a Wii or DS is linked from a friend code the
        player reads off a game. The console then appears in `/me`'s
        `linked_platforms` under namespace `wfc`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_code]
              properties:
                friend_code: { type: string, examples: ["1234-5678-9012"] }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string, examples: ["wfc"] }
                  linked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No Wii/DS profile has that friend code. }
        "409": { description: That console is linked to another account. }
        "502": { description: The Wii/DS server did not answer. }
        "503": { description: Wii/DS linking is not configured on this deployment. }
  /me/links/{namespace}:
    delete:
      summary: Unlink the account's console in a namespace
      description: |
        Addressed by namespace (`switch`, `wfc`, as listed in `/me`'s
        `linked_platforms`), so only the caller's own link can be revoked.
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string, examples: ["wfc"] } }
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  unlinked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Wii U and 3DS console accounts are listed in `linked_platforms` (namespaces `wiiu`, `3ds`) but cannot be unlinked here, as on the website." }
        "404": { description: No console is linked in that namespace. }
  /auth/config:
    get:
      summary: What the signup and reset forms need
      security: []
      description: |
        Public. Whether `/register` and `/password/forgot` want a Cloudflare
        Turnstile answer. When `enabled`, a client shows the widget page at
        `widget_path` on this site (in a webview; the page posts
        `{"kind":"token"|"error"|"expired","token":"..."}` to the
        `OpenPakTurnstile` JavaScript channel) and sends the token as
        `turnstile_token`. A token is single use.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [turnstile]
                properties:
                  turnstile:
                    type: object
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                      site_key: { type: string, description: "Present when enabled." }
                      widget_path: { type: string, examples: ["/turnstile-widget"], description: "Present when enabled." }
  /register:
    post:
      summary: Create an account
      security: []
      description: |
        Public. The answer is the same whether or not the address is taken, so
        it cannot be used to discover accounts; a verification mail follows,
        and the account can mint a token once verified. When Turnstile is on
        (see `/auth/config`) a passed `turnstile_token` is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, handle]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                display_name: { type: string, maxLength: 32, description: "Editable account name; defaults to the handle." }
                handle: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{5,14}$", description: "Permanent case-insensitively unique public account identifier." }
                country: { type: string, minLength: 2, maxLength: 2, examples: ["IE"] }
                birthday: { type: string, format: date, examples: ["1990-01-01"] }
                turnstile_token: { type: string, description: "The Turnstile answer; required when /auth/config says enabled." }
      responses:
        "202":
          description: Accepted; check the inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: "Invalid, reserved or profane handle, or `turnstile_failed`: no or a refused Turnstile answer." }
        "503": { description: "`turnstile_unavailable`: Cloudflare did not answer; the check fails closed." }
        "409": { description: Handle unavailable. }
        "403": { description: Registrations are closed. }
        "429": { $ref: "#/components/responses/RateLimited" }
  /handle/check:
    get:
      summary: Check public handle availability
      security: []
      description: Shares the registration IP rate limit. The core validates the handle; registration checks availability atomically again.
      parameters:
        - { in: query, name: h, required: true, schema: { type: string, maxLength: 15 } }
      responses:
        "200":
          description: Validation and availability
          content:
            application/json:
              schema:
                type: object
                required: [valid, available]
                properties:
                  valid: { type: boolean }
                  available: { type: boolean }
                  reason: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Account service unavailable. }
  /password/forgot:
    post:
      summary: Send a password reset mail
      security: []
      description: |
        Public, and the same answer whether or not the address has an account.
        The mail links to the website's reset page. When Turnstile is on (see
        `/auth/config`) a passed `turnstile_token` is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                turnstile_token: { type: string, description: "The Turnstile answer; required when /auth/config says enabled." }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: "`turnstile_failed`: no or a refused Turnstile answer." }
        "503": { description: "`turnstile_unavailable`: Cloudflare did not answer; the check fails closed." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /password/reset:
    post:
      summary: Choose a new password with a reset token
      security: []
      description: |
        Public: the step the website's reset page performs, for an app that
        opens the reset mail's link itself. The token is the `token` query
        parameter of that link. The core revokes every session of the account,
        and with them every bearer, so the app signs in again afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: The password was changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }
        "400":
          description: A field is missing, or the token is invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/chat:
    get:
      summary: Conversations, newest message first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        peer: { type: string, description: The other account's id. }
                        newest: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Chat is not available on this deployment. }
  /me/chat/{peer}:
    parameters:
      - { name: peer, in: path, required: true, schema: { type: string }, description: The other account's id. }
    get:
      summary: History with one peer, oldest first
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, format: int64 }, description: Only messages with a greater id. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
        "400": { description: after is not a message id. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Chat is not available on this deployment. }
    post:
      summary: Send a message; the recipient's consoles are told
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "400": { description: body is empty. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            The account core refuses the message: one side has blocked the
            other, or the two are not friends. Nothing was sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { description: Whether the message is allowed could not be checked. }
        "503": { description: Chat is not available on this deployment. }
  /me/voice:
    get:
      summary: The voice room of the game you are playing right now
      description: |
        Voice chat runs on the phone, never on the console. A game room is the matchmaking
        gathering this account is in right now, as the title server reports it; `room` is null
        when it is in none (or no title server could say). Members are the gathering's players
        with an OpenPak account; `in_voice` marks the ones connected to the room.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { oneOf: [{ $ref: "#/components/schemas/VoiceRoom" }, { type: "null" }] }
                  max_members: { type: integer, description: The mesh ceiling (8). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/voice/rooms:
    post:
      summary: Make a code room, for talking outside a game
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { $ref: "#/components/schemas/VoiceRoom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/voice/rooms/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Six characters; case, spaces and dashes are ignored. }
    get:
      summary: A room and who is connected to it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { $ref: "#/components/schemas/VoiceRoom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No room has that code (voice_room_unknown). }
  /me/voice/ws:
    get:
      summary: The room's signaling socket (WebSocket)
      description: |
        Upgrade to a WebSocket (subprotocol `openpak-voice`). The bearer goes in the
        Authorization header, or, from a browser that cannot set one, as a second offered
        subprotocol `bearer.<token>` (never echoed back). Frames are JSON text:

        - server: `welcome` {self, name, room, peers, ice_servers}, `join` {peer}, `leave` {id},
          `signal` {from, data}, `state` {id, muted, speaking}, `ping`, `error` {code, message}
        - client: `signal` {to, data} (relayed to that peer only), `state` {muted, speaking}

        The newcomer sends a WebRTC offer to every peer in its welcome; the others only answer.
        `ice_servers` carries STUN and a time-limited TURN credential. A room holds 8 phones
        (full mesh); one account joining again replaces its earlier socket.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "101": { description: Switching protocols. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No room has that code (voice_room_unknown). }
        "409": { description: The room is full (voice_room_full). }
  /regions:
    get:
      summary: The region nodes a room may be served from
      security: []
      description: |
        Public. Federation nodes in rotation: approved, every server
        reporting within the last few minutes, and meeting the hardware and
        bandwidth minimums (or an admin waiver, which is never shown here).
        Each carries the addresses its servers run (`services`, e.g. `photon`,
        `npln_relay`, `turn`), its coverage-plan `region` and how many people
        are on it. Matchmaking stays at home; a host's room is placed on the
        node for their country and joiners are sent there by the room itself.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: ["au-sydney"] }
                        name: { type: string }
                        country: { type: string, examples: ["AU"] }
                        region: { type: string, examples: ["oc"], description: "coverage-plan code; empty for a node created outside the plan" }
                        services:
                          type: object
                          additionalProperties: { type: string }
                        players: { type: integer }
                        last_seen_unix: { type: integer }
        "503": { description: Federation is not configured on this deployment. }
  /federation/join:
    post:
      summary: Enrol one server of a region node
      security: []
      description: |
        Called once per server with the node key as the bearer
        (`Authorization: Bearer opnode_...`). Returns the server's own key,
        shown once; the server uses it for everything else. Joining the same
        name again replaces that server's key (a reinstalled box). The node key
        can do nothing but this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, examples: ["game1"], description: "[a-z0-9-], 1..32, unique within the node" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id: { type: string, examples: ["au-sydney/game1"] }
                  key: { type: string, description: "opsrv_..., shown once" }
        "400": { description: "Invalid name." }
        "401": { description: "No node key, or one the core does not know." }
  /federation/announce:
    post:
      summary: A region server announces its roles and hardware
      security: []
      description: |
        Called by each server about once a minute with its own key as the
        bearer (`Authorization: Bearer opsrv_...`). Replaces the server's
        roles and hardware report and marks it seen; home records the address
        the request came from, so announce over IPv4. Reports are
        self-declared and gate rotation only. The node is in `/regions` while
        it is approved and every server is reporting and meets the minimums;
        `problems` says what keeps it out. `selftest_due` asks the server to run
        the bandwidth self-test now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: object
                  description: "role -> host:port; roles: photon, turn, stun, npln_relay"
                  additionalProperties: { type: string }
                  examples: [{ photon: "203.0.113.9:22002", turn: "203.0.113.9:3478" }]
                report:
                  type: object
                  properties:
                    cores: { type: integer }
                    ram_mb: { type: integer, description: "MemTotal, MiB" }
                    disk_gb: { type: integer, description: "data filesystem size, GB" }
                    disk_ssd: { type: boolean, description: "NVMe or SATA SSD" }
                    ipv4: { type: string }
                    ipv6: { type: string }
                    port_mbps: { type: integer, description: "declared symmetric port speed" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  server_id: { type: string }
                  approved: { type: boolean }
                  in_rotation: { type: boolean }
                  problems: { type: array, items: { type: string } }
                  selftest_due: { type: boolean }
        "400": { description: "Unknown role or invalid report." }
        "401": { description: "No server key, a node key (join first), or a key the core does not know." }
  /federation/selftest:
    get:
      summary: Bandwidth self-test, download leg
      security: []
      description: |
        Server key as the bearer. Home streams the reserved number of bytes
        (100 MB by default) and records how fast they left, measured at home.
        One per server per day; a transfer that has not finished within a
        minute records nothing.
      responses:
        "200": { description: "The bytes, application/octet-stream." }
        "401": { description: "No server key, or one the core does not know." }
        "429": { description: "Already run in this interval; the message says when the next is allowed." }
    post:
      summary: Bandwidth self-test, upload leg
      security: []
      description: |
        Server key as the bearer; the body is the reserved number of bytes
        (send exactly that many). Home times them from the first byte and
        records the result. `X-OpenPak-RTT-Ms` may carry the server's own
        round-trip measurement to home, stored as server-reported. One per
        server per day.
      parameters:
        - { in: header, name: X-OpenPak-RTT-Ms, required: false, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Measured
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id: { type: string }
                  up_mbps: { type: number }
        "400": { description: "Empty or short upload." }
        "401": { description: "No server key, or one the core does not know." }
        "429": { description: "Already run in this interval." }
  /network/profile:
    get:
      summary: The OpenPak network profile — what to redirect, and where
      security: []
      description: |
        Generated from the routing this server actually runs (PRD
        website/prds/network-profile-service-prd.md), so adding a title is a server deploy,
        not six client releases. One conditional GET per launch: send
        `If-None-Match` with the stored ETag and an unchanged profile is a
        304. Public, identical for everyone, no credentials.

        The client's own compiled-in allowlist stays the ceiling: the server
        may narrow, never widen, and a profile entry outside that allowlist
        is dropped and logged client-side.
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [switch, wiiu, 3ds, wii, ds]
          description: |
            Omitted means every platform united — what a diagnostic or the
            website itself wants and no emulator does.
      responses:
        "200":
          description: The current profile for the platform
          headers:
            ETag:
              description: Strong entity tag; echo it in If-None-Match
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProfile"
        "304":
          description: Unchanged; the stored profile is still current
          headers:
            ETag:
              schema: { type: string }
        "400": { description: Unknown platform. }
        "503": { description: Profiles not configured on this deployment. }
  /network/ca.pem:
    get:
      summary: The console CA the profile pins
      security: []
      description: |
        The PEM of the CA console-facing certificates chain to, published
        under the profile's `ca.url` and pinned by its `ca.sha256` — a
        profile cannot swap the trust anchor without the hash changing.
        A client bootstraps trust from nothing but openpak.org: fetch the
        profile, fetch this, check the digest before trusting it.
      responses:
        "200":
          description: The CA, PEM-encoded
          headers:
            ETag:
              schema: { type: string }
            X-CA-Sha256:
              description: The same digest the profile's `ca.sha256` carries
              schema: { type: string }
          content:
            application/x-pem-file:
              schema: { type: string }
        "304": { description: Unchanged. }
        "404": { description: No CA available on this deployment. }
        "503": { description: Profiles not configured on this deployment. }
  /network/ceiling:
    get:
      summary: The signed redirect ceiling
      security: []
      description: |
        Per platform, the domain families a client may redirect at all
        (docs/signed-ceiling.md). An envelope signed off the box with a
        pinned Ed25519 key and served byte for byte as signed: the server
        holds no key and never rewrites it. Verify the signature over the
        decoded payload bytes, then parse them; rollback protection is the
        client's.
      responses:
        "200":
          description: The signed envelope
          headers:
            ETag:
              description: sha256 of the served bytes
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [payload, signatures]
                properties:
                  payload:
                    type: string
                    description: base64 of the exact payload bytes
                  signatures:
                    type: array
                    items:
                      type: object
                      required: [keyid, sig]
                      properties:
                        keyid: { type: string, description: hex sha256 of the raw public key }
                        sig: { type: string, description: base64 Ed25519 signature over the payload bytes }
        "304": { description: Unchanged. }
        "503": { description: No verified ceiling file on this deployment. }
  /requests:
    get:
      summary: The votable catalogue (titles and network features)
      security: []
      description: |
        The same request/vote scoreboard the website shows. Each item carries a
        live vote count. Auth is optional: `voted` is false when the request is
        unauthenticated, and reflects the caller's own votes when a valid bearer
        is sent. Returns every item; the client filters and sorts. `kind`
        narrows to titles or features.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [title, feature] }
          description: Restrict to titles or features; omit for both.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, examples: [42] }
                        kind: { type: string, examples: ["title"] }
                        name: { type: string, examples: ["Tetris 99"] }
                        console: { type: string, examples: ["Switch"] }
                        category: { type: string }
                        backend: { type: string }
                        status: { type: string, examples: ["requestable"] }
                        notes: { type: string }
                        sort: { type: integer }
                        title_id: { type: string, description: "16 hex digits, upper case; empty when unknown." }
                        title_ids: { type: array, items: { type: string }, description: "Every id the title has (one per region), title_id first." }
                        date_added: { type: string, format: date-time }
                        last_updated: { type: string, format: date-time }
                        verse_url: { type: string, description: "The game's OpenVerse community (live and beta titles only; absent otherwise)." }
                        art_url: { type: string, description: "The titles page's picture: a Switch title's icon (/titles/icon/<id>) or the cover tile (/static/art/titles/...); empty when none, then draw the console mark. Titles only." }
                        votes: { type: integer }
                        voted: { type: boolean }
  /catalog.json:
    get:
      summary: Every title and feature, in the old catalog.json shape
      security: []
      description: |
        Public, read-only. A bare array in catalog order; each entry has kind, name,
        console, category, backend, status, notes, playability, date_added and
        last_updated. The
        database is the source; this replaces openpak/catalog's catalog.json.
        Rate limited per client address.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogEntry" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/titles:
    post:
      summary: Add a title or feature to the catalog
      security: [{ catalogKey: [] }, { adminSession: [] }]
      description: |
        kind (title|feature), name and status are required. status is one of live,
        working, beta, alpha, partial, planned, requestable, not-feasible. sort
        omitted files the entry last. The write and its request_changes row are one
        transaction. Unknown fields are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "400": { description: Invalid body or status }
        "401": { description: No valid key or session }
        "403": { description: Signed in but not an admin, or no X-CSRF-Token }
        "409": { description: The same kind, name and console exists }
  /admin/titles/{id}:
    patch:
      summary: Change any of a catalog entry's fields
      security: [{ catalogKey: [] }, { adminSession: [] }]
      description: |
        Partial update: only the fields sent change (kind cannot). Bumps
        last_updated and logs the old and new value of each changed field in
        request_changes. A body that changes nothing writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogWrite" }
      responses:
        "200":
          description: The entry after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "400": { description: Invalid body or status }
        "401": { description: No valid key or session }
        "403": { description: Signed in but not an admin, or no X-CSRF-Token }
        "404": { description: No such entry }
        "409": { description: Renamed onto an existing kind, name and console }
    delete:
      summary: Remove a catalog entry nobody voted for
      security: [{ catalogKey: [] }, { adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted and logged }
        "401": { description: No valid key or session }
        "403": { description: Signed in but not an admin, or no X-CSRF-Token }
        "404": { description: No such entry }
        "409": { description: The entry has votes }
  /titles:
    get:
      summary: The title catalogue, as the website lists it
      security: []
      description: |
        Public. Every title with its status, in the website's /titles order:
        what can be played first, grouped by console and alphabetical, then
        the long tail the same way. `requestable` marks the titles the page
        keeps behind "Request a game"; their votes are on GET /requests.
        Rate limited per client address.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  titles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, examples: [42] }
                        name: { type: string, examples: ["Stardew Valley"] }
                        console: { type: string, examples: ["Switch"] }
                        category: { type: string }
                        title_id: { type: string, examples: ["0100E65002BB8000"] }
                        title_ids: { type: array, items: { type: string }, description: "Every id the title has (one per region), title_id first." }
                        status: { type: string, examples: ["live"] }
                        notes: { type: string }
                        requestable: { type: boolean }
                        playability:
                          type: object
                          additionalProperties: { type: string, enum: [playable, ingame, menus, boots, nothing] }
                          description: "How far the game itself runs per client, keyed by the grid's client name. Always present; {} when nothing is known."
                          examples: [{ "Ryujinx": "playable", "Citron": "ingame" }]
        "429": { $ref: "#/components/responses/RateLimited" }
  /requests/{id}/vote:
    post:
      summary: Toggle the caller's vote on a request
      description: |
        Idempotent per account: voting an item you already voted for removes the
        vote. Returns the request's fresh count and the caller's new state.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: The request id from GET /requests.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  votes: { type: integer }
                  voted: { type: boolean }
        "400": { description: Missing or unknown request id. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "The request is not votable (a live/beta game, or a feature); no vote is recorded." }
        "429": { $ref: "#/components/responses/RateLimited" }
  /avatars:
    get:
      summary: The built-in avatars
      description: |
        The same set the website offers, so a client shows what exists rather
        than a hardcoded list that drifts. `url` is relative to the site and
        immutable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatars:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: ["aurora"] }
                        url: { type: string, examples: ["/media/avatars/preset/aurora"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/avatar:
    post:
      summary: Choose a built-in avatar, or upload a photo
      description: |
        JSON `{"preset"}` picks a built-in; multipart/form-data with an
        `avatar` file field uploads a PNG or JPEG of up to 4 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { type: string, examples: ["aurora"] }
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
        "400": { description: "preset is required or unknown, or the upload is not a PNG/JPEG within 4 MiB" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Avatars are not configured on this deployment. }
  /me/push:
    post:
      summary: Register this install for notifications
      description: |
        Records the device token this install can be reached at. Keyed by the
        token, so the same phone signing in as a different account moves the
        registration rather than leaving the previous account's notifications
        arriving on it.

        Delivery is through FCM, which reaches Android directly and iOS via
        APNs. iOS therefore also needs an APNs key uploaded to the Firebase
        project; without one, iOS installs register successfully and receive
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The transport's device token. }
                platform:
                  type: string
                  default: fcm
                  description: Which transport the token belongs to.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: boolean }
        "400": { description: token is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Stop notifying this install
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten: { type: boolean }
        "400": { description: token is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/requests:
    get:
      summary: Pending incoming and outgoing friend requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incoming:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
                  outgoing:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Send a friend request by friend code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_code]
              properties:
                friend_code:
                  type: string
                  description: Display form (SW-xxxx-xxxx-xxxx, an OpenPak handle, xxxx-xxxx-xxxx), a Nintendo Network ID, or a bare subject.
                  examples: ["SW-0123-4567-89ab"]
                kind:
                  type: string
                  enum: [handle, switch, 3ds, wiiu, email]
                  description: |
                    Which kind of code friend_code is. Omitted, a handle is tried first, followed by a numeric Switch code.
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  account_id: { type: string }
        "400": { description: Cannot befriend yourself }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No account for that friend code }
        "409": { description: Conflicting relationship state }
  /me/friends/requests/accept:
    post:
      summary: Accept a pending incoming request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountIDBody"
      responses:
        "200": { description: Friend added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: No pending request }
  /me/friends/requests/decline:
    post:
      summary: Decline a pending incoming request
      description: |
        Removes the pending request, as the website's Decline button does.
        Declining one that is already gone is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/remove:
    post:
      summary: Remove a friendship or decline a pending request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/block:
    post:
      summary: Block an account (durable, directional)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Blocked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/unblock:
    post:
      summary: Remove a block
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountIDBody" }
      responses:
        "200": { description: Unblocked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/blocked:
    get:
      summary: Accounts the caller has blocked
      description: Unblock with `POST /me/friends/unblock`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [blocked]
                properties:
                  blocked:
                    type: array
                    items: { $ref: "#/components/schemas/BlockedAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/2fa/setup:
    post:
      summary: Start two-factor enrolment
      description: |
        Asks for the password even though the caller is signed in, so a
        borrowed token cannot tie the account to someone else's phone.
        Calling it again before enabling replaces the pending secret.
        Consoles that sign in with the account password (Switch, Wii U, 3DS)
        cannot complete a second factor yet: once 2FA is on, their password
        sign-in fails until their adapters support it. Tell the user before
        they enable it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The secret for an authenticator app, as text and as an otpauth URI.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string, description: Base32 TOTP secret. }
                  otpauth_uri: { type: string, examples: ["otpauth://totp/OpenPak:a%40x.test?secret=JBSWY3DPEHPK3PXP&issuer=OpenPak"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Two-factor authentication is already on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/2fa/enable:
    post:
      summary: Finish enrolment with a first code
      description: Returns the ten recovery codes. They are shown once and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, examples: ["123456"] }
      responses:
        "200":
          description: Two-factor authentication is on.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: { type: string, examples: ["abcde-fghij"] }
        "401":
          description: Wrong code, or a missing or expired bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No pending setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TwoFactorLocked" }
  /me/2fa/disable:
    post:
      summary: Turn two-factor authentication off
      description: Needs the password and a current code; a recovery code counts as a code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Off
          content:
            application/json:
              schema:
                type: object
                properties:
                  disabled: { type: boolean }
        "401":
          description: Wrong code, or a missing or expired bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Two-factor authentication is not on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TwoFactorLocked" }
  /me/email:
    post:
      summary: Start changing the account's email address
      description: |
        Needs the password. A confirmation link goes to the new address (and a
        notice to the old one); nothing changes until the link is opened, on
        the website's `/email/confirm` page or through `POST /email/confirm`.
        The answer never says whether the new address belongs to someone else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string }
      responses:
        "202":
          description: Accepted; a link is on its way if the address can be used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Not an address, or already the account's own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /email/confirm:
    post:
      summary: Apply an email change from its mailed token
      security: []
      description: Public; the token is the credential. Shares the token-minting rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
        "400":
          description: The token is invalid or has expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/verify/resend:
    post:
      summary: Send the email verification link again
      description: |
        The same answer whether a mail went out, was throttled (one per 10
        minutes) or the address is already verified.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /news:
    get:
      summary: The latest published news articles
      security: []
      description: |
        Public, newest first, on the same per-client budget as `/titles`. An
        empty list when the deployment has no news service configured.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items: { $ref: "#/components/schemas/NewsArticle" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /titles/{title_id}/mods:
    x-served-by: mods
    get:
      summary: Published mods for a title
      parameters: [{ name: title_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Manifest: id, slug, version, sha256, size, licence, summary, package_url" }
  /mods/{id}:
    x-served-by: mods
    get:
      summary: One mod entry
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The entry }
        "404": { description: Not published }
  /mods/{id}/package:
    x-served-by: mods
    get:
      summary: The mod package (zip); ETag is the sha256, honours If-None-Match
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: application/zip }
        "304": { description: Unchanged }
        "404": { description: Not published }
  /submissions:
    x-served-by: mods
    post:
      summary: Submit a mod package (multipart field "package") for curation
      responses:
        "202": { description: Accepted into the queue }
        "422": { description: "Refused by the provenance gate, with the reason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/submissions:
    x-served-by: mods
    get:
      summary: The caller's submissions and their status
      responses:
        "200": { description: List }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/favourites:
    x-served-by: mods
    get:
      summary: The caller's favourite mods
      responses:
        "200": { description: List }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/favourites/{id}:
    x-served-by: mods
    put:
      summary: Favourite a mod
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Unfavourite a mod
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/wiiu:
    get:
      summary: The account's Wii U identity (PNID, NEX credentials, Mii), minted on first sight
      responses:
        "200":
          description: The identity as nn-account reports it; the emulator writes it into its emulated console.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleIdentity" }
        "502": { description: nn-account did not answer. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
  /me/wiiu/console-password:
    get:
      summary: The Network ID to type on a Wii U or 3DS, and where its password comes from
      description: The OpenPak password is the console password (mode sync), set whenever the website or app sees it at sign-in or password change. mode incompatible means it cannot be typed on a Wii U and a separate console password is needed; custom means one is set.
      responses:
        "200":
          description: The Network ID and password source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nnid: { type: string }
                  pid: { type: integer }
                  mode: { type: string, enum: ["", sync, custom, incompatible] }
                  min: { type: integer }
                  max: { type: integer }
        "404": { description: The account has no Wii U ID yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
    post:
      summary: Set a separate console password, for an OpenPak password a Wii U cannot take
      description: Asks for the OpenPak password again (and a code when two-factor authentication is on). 6 to 16 printable ASCII characters without spaces, not containing the Network ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, console_password]
              properties:
                current_password: { type: string }
                code: { type: string }
                console_password: { type: string }
      responses:
        "200": { description: "Set. Answers {ok, nnid}." }
        "403": { description: Wrong password, or a code is needed or wrong. }
        "422": { description: "The console password breaks the rules (code password_length, password_ascii or password_is_id)." }
        "429": { description: Too many wrong codes. }
        "502": { description: nn-account did not answer. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
  /me/3ds:
    get:
      summary: The account's 3DS identity (PNID, NEX credentials, friend code, Mii), minted on first sight
      responses:
        "200":
          description: The identity as nn-account reports it; the emulator writes it into its emulated console.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleIdentity" }
        "502": { description: nn-account did not answer. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Not configured }
  /me/switch:
    get:
      summary: The account's Switch identity for an emulator, minted on first sight
      description: The PID and friend code games see, the openpak token, and the friend graph with presence and requests.
      responses:
        "200":
          description: The identity as the Switch adapter (nx-baas /internal/switch/emulator) reports it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchIdentity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: The Switch adapter did not answer. }
  /me/switch/friend:
    post:
      summary: Act on the Switch friend graph from an emulator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [request, accept, decline] }
                friend_code: { type: string, description: For request. }
                pid: { type: integer, format: int64, description: For accept and decline. }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: The adapter refused; the message says why. }
  /me/switch/link:
    post:
      summary: The id_token an emulated console's device account binds with
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id_token]
                properties:
                  id_token: { type: string, description: "Nintendo-Account id_token (JWT) that /1.0.0/federation binds the device account with." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: The Switch adapter did not answer. }
  /me/saves:
    get:
      summary: Every saved game with its versions, and storage usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  saves:
                    type: array
                    items: { $ref: "#/components/schemas/Save" }
                  usage: { $ref: "#/components/schemas/SaveUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/versions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: One version's bytes
      responses:
        "200":
          description: The save
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
    delete:
      summary: Delete a version
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/versions/{id}/restore:
    post:
      summary: Make a version the current one; the previous one stays
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/{platform}/{title}:
    parameters:
      - { name: platform, in: path, required: true, schema: { type: string, examples: ["switch"] } }
      - { name: title, in: path, required: true, schema: { type: string } }
    get:
      summary: Retired. The emulator save routes are gone; the cloud is console backups only.
      deprecated: true
      responses:
        "410": { description: "Gone: emulator saves are retired; OpenPak's Save Data Cloud is console archives only." }
    put:
      summary: Retired. See GET.
      deprecated: true
      responses:
        "410": { description: Gone. }
    delete:
      summary: Delete every backup of a title (pinned ones too). Ask the player to confirm first.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, description: How many backups were deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/storage:
    get:
      summary: The account's storage settings, test result, move state and usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveStorage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
    put:
      summary: Connect S3 or WebDAV storage; it is tested before it is stored
      description: An empty secret keeps the stored one when the key or username is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [s3, webdav], default: s3 }
                s3:
                  type: object
                  properties:
                    endpoint: { type: string }
                    region: { type: string }
                    bucket: { type: string }
                    prefix: { type: string }
                    access_key: { type: string }
                    secret_key: { type: string }
                    insecure: { type: boolean }
                    path_style: { type: boolean }
                webdav:
                  type: object
                  properties:
                    url: { type: string }
                    username: { type: string }
                    password: { type: string }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  storage: { $ref: "#/components/schemas/SaveStorage" }
                  warning: { type: string }
        "400": { description: Invalid JSON. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The storage failed its test.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, examples: ["storage_test_failed"] }
                  detail: { type: string }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
    delete:
      summary: Disconnect; versions stored there stay listed but unreachable
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/storage/move:
    post:
      summary: Copy the saves in the allowance into the connected storage, in the background
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  move_state: { type: string, examples: ["moving"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/storage/kinds:
    get:
      summary: Which storage kinds this deployment offers
      responses:
        "200":
          description: Kind name to whether it is offered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: boolean }
                examples: [{ s3: true, webdav: true, gdrive: false, onedrive: false }]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /me/saves/storage/oauth/{provider}/url:
    get:
      summary: A consent URL to open in a browser; the website's callback finishes the connection
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, examples: ["gdrive", "onedrive"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/SavesError" }
        "503": { $ref: "#/components/responses/SavesUnavailable" }
  /pakka/state:
    get:
      summary: Whether the signed-in account may chat with Pakka, and whether it accepted the data-use notice
      description: |
        Pakka is the OpenPak assistant (a Meta AI model; see the privacy page). It is refused,
        with `eligible: false`, for child, supervised, under-18 and unknown-age accounts, with no
        override. Everything under `/pakka` is forwarded to Pakka for the bearer's own account;
        no account id is ever accepted from the client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  eligible: { type: boolean }
                  consent: { type: boolean }
                  notice_version: { type: string }
                  retention_days: { type: integer }
                  daily_cap: { type: integer }
                  max_chars: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: "Pakka is not answering (code unavailable)." }
        "503": { description: "Pakka is not available on this deployment." }
  /pakka/consent:
    post:
      summary: Accept the data-use notice
      description: Required once per notice version before the first message. 403 `not_available` for an account that may not use Pakka.
      responses:
        "200": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not available on this account (code not_available). }
    delete:
      summary: Withdraw acceptance of the data-use notice
      responses:
        "200": { description: Withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /pakka/conversations:
    get:
      summary: Your Pakka conversations, newest first
      description: Titles only. Conversations are kept 30 days after their last message.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/PakkaConversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start a conversation
      description: 403 `consent_required` before the notice is accepted, 403 `not_available` for an account that may not use Pakka, 409 `conversation_limit` at 30 stored conversations.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PakkaConversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "consent_required or not_available." }
        "409": { description: "conversation_limit." }
  /pakka/conversations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One conversation with its messages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PakkaConversation" }
                  - type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            role: { type: string, enum: [user, assistant] }
                            text: { type: string }
                            at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not found, or not yours. }
    delete:
      summary: Delete a conversation
      description: Removes the stored copy at once. Text already sent to the model provider follows its retention.
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not found, or not yours. }
  /pakka/conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Send a message and stream Pakka's reply
      description: |
        Body `{"text": "..."}` (2000 characters at most). The answer is `text/event-stream`:
        `start`, then `tool` events (`{"name"}`, while Pakka looks something up), `delta`
        events (`{"text"}`, reply text in order), and `done` (`{"message_id"}`), or `error`
        (`{"code"}`). Refusals before the stream are JSON: 429 `rate_limited` (6 a minute,
        Retry-After) or `daily_cap` (100 a day), 409 `busy`, 400 `bad_message`, 403
        `consent_required` / `not_available`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "consent_required or not_available." }
        "404": { description: Not found, or not yours. }
        "429": { description: "rate_limited or daily_cap." }
  /me/rewards:
    get:
      summary: Rewards, as the website's /account/rewards shows them
      description: |
        The header (balance, today's play points against the cap), missions as tiles (a ladder is one tile
        showing the tier being worked on), the recent points history, the shop (only what the account does
        not own, plus `upcoming` seasonal items) and My items. Texts are worded in the caller's language
        (`Accept-Language`, or `?lang=`); pictures are site paths (`/account/rewards/preview/{id}`,
        `/static/rewards/{art}.png`) that need no credential.
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rewards" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: "The rewards service did not answer (code rewards_unavailable)." }
        "503": { description: "Rewards are not available on this deployment (code rewards_unavailable)." }
  /me/rewards/theme:
    get:
      summary: The equipped theme's validated tokens
      description: |
        `{"theme": null}` when none is equipped or its asset is unusable. The tokens are the website's
        (`paper`, `ink`, `accent`, `on-accent`, ...), as validated colours for light and dark; the app builds
        its theme from them and falls back to the default. Any shop theme can be previewed without an
        account through `GET /themes/{id}` (same shape).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  theme:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      light: { type: object, additionalProperties: { type: string } }
                      dark: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Rewards are not available on this deployment. }
  /me/rewards/claim:
    post:
      summary: Claim a completed mission's reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mission]
              properties:
                mission: { type: string }
                period: { type: string, description: "Empty for the current period." }
      responses:
        "200":
          description: Claimed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  points: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The account is frozen (code rewards_frozen)." }
        "409": { description: Already claimed. }
        "503": { description: Rewards are not available. }
  /me/rewards/redeem:
    post:
      summary: Buy a shop item
      description: A retry with the same `Idempotency-Key` header is charged once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { type: string }
      responses:
        "200": { description: Bought. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { description: "Not enough points (code not_enough_points)." }
        "403": { description: "The account is frozen (code rewards_frozen)." }
        "409": { description: "Already owned (code already_owned)." }
        "503": { description: Rewards are not available. }
  /me/rewards/equip:
    post:
      summary: Put an owned item in its slot, or empty the slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: string, description: "badge, profile_icon or theme." }
                item: { type: string, description: "Empty clears the slot." }
      responses:
        "200": { description: Done. }
        "400": { description: slot is missing. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Rewards are not available. }
  /me/rewards/settings:
    post:
      summary: Showcase and pause switches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showcase: { type: boolean, description: Show your badge to others. }
                paused: { type: boolean, description: Stop earning points. }
      responses:
        "200": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Rewards are not available. }
  /me/discord:
    get:
      summary: Discord link status
      description: |
        `configured` is false while the deployment has no Discord OAuth credentials; hide the row then, as
        the website does. Linking is Discord's OAuth round trip ending on the website's callback with the
        browser's own session, so the app opens `/account#devices` in the browser to start it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [configured, linked]
                properties:
                  configured: { type: boolean }
                  linked: { type: boolean }
                  username: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Unlink Discord
      responses:
        "204": { description: Unlinked (or nothing was linked). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/operator:
    get:
      summary: Running a region node, as /account/operator shows it
      description: The admission figures, the open locations, the roles a server may take and this account's applications.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  in_review: { type: boolean, description: An application is pending or waits for your reply. }
                  roles: { type: array, items: { type: string } }
                  max_servers: { type: integer }
                  terms_url: { type: string }
                  requirements: { type: object, additionalProperties: true }
                  locations:
                    type: array
                    items: { type: object, properties: { code: { type: string }, country: { type: string }, city: { type: string } } }
                  applications:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "Applications are not available (code operator_unavailable)." }
    post:
      summary: Apply to run a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location, city, provider, email, terms, servers]
              properties:
                location: { type: string }
                city: { type: string }
                provider: { type: string }
                email: { type: string }
                notes: { type: string }
                terms: { type: boolean }
                servers:
                  type: array
                  items:
                    type: object
                    properties:
                      cores: { type: integer }
                      ram_gb: { type: integer }
                      disk_gb: { type: integer }
                      disk_ssd: { type: boolean }
                      bandwidth_mbps: { type: integer }
                      ipv6: { type: boolean }
                      roles: { type: array, items: { type: string } }
      responses:
        "201": { description: Applied. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: An application is already in review. }
        "422": { description: "Not accepted: `errors` lists what falls short, in the caller's language." }
        "503": { description: Applications are not available. }
  /me/operator/waitlist:
    post:
      summary: Join the waitlist for a country nobody is wanted in yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, email]
              properties:
                country: { type: string }
                city: { type: string }
                email: { type: string }
      responses:
        "201": { description: Added. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Not accepted. }
  /me/operator/reply:
    post:
      summary: Answer an admin's question on your application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reply]
              properties:
                id: { type: integer, format: int64 }
                reply: { type: string }
      responses:
        "200": { description: Sent; the application is back in review. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such application. }
  /me/tickets:
    get:
      summary: Your help tickets, newest activity first
      description: |
        The same threads the website's /help page shows. There is no email on
        a reply (the website has no mail path): the app shows the thread, and a
        push with `data.type = "ticket_reply"` and `data.ticket_id` arrives when
        FCM is configured.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tickets, categories, attachments]
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
                  categories:
                    type: array
                    items: { type: string }
                    description: The accepted `category` values, in the order to offer them.
                  attachments: { type: boolean, description: Whether this deployment keeps files. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "Help tickets are not available on this deployment (code tickets_unavailable)." }
    post:
      summary: Open a help ticket
      description: JSON, or multipart/form-data with the same fields plus an optional `attachment` file (10 MB at most).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TicketInput" }
                - type: object
                  properties:
                    attachment: { type: string, format: binary }
      responses:
        "201":
          description: Opened; the ticket with its thread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketThread" }
        "400":
          description: A field is missing or invalid (the message names it), or a file was sent to a deployment without attachments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: "The attachment is larger than 10 MB (code attachment_too_large)." }
        "503": { description: Help tickets are not available on this deployment. }
  /me/tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: One ticket and its thread, oldest message first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketThread" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such ticket, or not yours. }
        "503": { description: Help tickets are not available on this deployment. }
  /me/tickets/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Reply to your ticket
      description: A reply puts the ticket back in the queue (`open`), a closed one included. JSON or multipart, like opening.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 20000 }
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 20000 }
                attachment: { type: string, format: binary }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketMessage" }
        "400": { description: The message is empty or too long. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such ticket, or not yours. }
        "413": { description: The attachment is larger than 10 MB. }
        "503": { description: Help tickets are not available on this deployment. }
  /me/tickets/{id}/attachments/{message}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: message, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Download the file on one message of your ticket
      description: Always `application/octet-stream` with `Content-Disposition` attachment. Use the `url` a message carries.
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such file, or not yours. }
  /crash-reports:
    post:
      summary: Send a crash report (emulators, the homebrew, the app)
      description: |
        Public. A bearer is optional: when it is valid the report is linked to
        the account, and when it is missing, expired or revoked the report is
        kept anonymously (never refused for it). Rate limit: 20 reports per 10
        minutes per client. Reports that share source, error code, title and
        top frame (the `top_frame` field, else the first line of a `stack` /
        `backtrace` field, else of `message`, with numbers and addresses
        blanked) share a `signature` and are counted as one problem.

        Send `multipart/form-data` with a `meta` part (JSON) and an optional
        `attachment` part (at most 20 MB, streamed to disk; parts in any order),
        or `application/json` whose body is the meta alone.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta: { $ref: "#/components/schemas/CrashMeta" }
                attachment: { type: string, format: binary, description: A dump or log, at most 20 MB. }
            encoding:
              meta: { contentType: application/json }
          application/json:
            schema: { $ref: "#/components/schemas/CrashMeta" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrashReceipt" }
        "400":
          description: No meta, meta not JSON, an unknown source, a field too long, or fields not an object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { description: "The attachment is larger than 20 MB (code attachment_too_large)." }
        "429": { description: Rate limited. }
  /internal/crash-reports:
    post:
      summary: A console's error report, relayed by nx-baas (service to service)
      description: |
        Not for clients: authenticated with `X-Internal-Key` (or
        `Authorization: Bearer`) equal to the website's `WEBSITE_INTERNAL_KEY`.
        An unset key disables the route (503). Stored like any report, with
        source `console`; `received_at` is when nx-baas received it.
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, fields]
              properties:
                source: { type: string, enum: [console] }
                received_at:
                  oneOf:
                    - { type: string, format: date-time }
                    - { type: integer, description: Unix seconds. }
                  description: Absent means now.
                device_id: { type: string, maxLength: 200 }
                account_id: { type: string, description: The core account id, when nx-baas knows it. }
                title_id: { type: string, maxLength: 200 }
                error_code: { type: string, maxLength: 200, description: "e.g. 2110-3127" }
                firmware: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 16000 }
                fields: { type: object, additionalProperties: true, description: The report's fields as nx-baas decoded them (64 KiB at most). }
                attachment_b64: { type: string, contentEncoding: base64, description: The raw report, at most 20 MB decoded. }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrashReceipt" }
        "400": { description: "Invalid JSON, source not console, received_at unreadable, or attachment_b64 not base64." }
        "401": { description: Wrong or missing key. }
        "413": { description: The attachment is larger than 20 MB. }
        "503": { description: WEBSITE_INTERNAL_KEY is not set on the website. }
  /companion/titles:
    get:
      summary: Titles that have a companion page
      description: |
        The catalogue titles that offer rankings or per-player stats, with the features each has.
        The same titles have a page at `/titles/{slug}` on the website. Public.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [titles]
                properties:
                  titles:
                    type: array
                    items: { $ref: "#/components/schemas/CompanionTitle" }
        "503": { description: Title pages are not configured on this deployment. }
  /companion/titles/{slug}:
    get:
      summary: One companion title
      description: The slug is the lower-case title name with hyphens; a game on two consoles has the console appended (`minecraft-switch`). A title with no companion feature is 404. Public.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionTitle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Title pages are not configured on this deployment. }
  /rankings:
    get:
      summary: The games that have rankings
      description: |
        Every game that keeps rankings, scored or not, grouped by console and with games that have scores first.
        A game nobody has scored in has has_scores false; board_names still names its boards.
        Public, read-only, cached for 30 seconds. See docs/rankings-contract.md.
      security: [{}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        console: { type: string }
                        boards: { type: integer }
                        has_scores: { type: boolean }
                        scored_boards: { type: integer }
                        board_names:
                          type: array
                          items: { type: string }
        "503": { description: Title pages are not configured on this deployment. }
  /rankings/{slug}:
    get:
      summary: One game's ranking boards
      security: [{}]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  console: { type: string }
                  boards:
                    type: array
                    items: { $ref: "#/components/schemas/RankingsBoard" }
        "404": { description: No such game, or it has no rankings. }
        "502": { description: The game's server did not answer. }
        "503": { description: Title pages are not configured on this deployment. }
  /rankings/{slug}/{board}:
    get:
      summary: One ranking board
      description: |
        Rows in rank order with player names and pictures resolved through the account core. `limit` defaults to 25
        (at most 100). `around` is an OpenPak account id: when that player is on the board `around` holds the rows up to
        five either side of them. `avatar` is a site-relative URL.
      security: [{}]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: board, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: around, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  board: { $ref: "#/components/schemas/RankingsBoard" }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/RankingsRow" }
                  around:
                    type: array
                    items: { $ref: "#/components/schemas/RankingsRow" }
        "404": { description: No such game or board. }
        "502": { description: The game's server did not answer. }
        "503": { description: Title pages are not configured on this deployment. }
  /companion/titles/{slug}/rankings:
    get:
      summary: A ranking board
      description: |
        One board of the title's rankings (a course, a mode, a season). `boards` lists every board; `board`
        picks one, the first when absent. `value` is the sortable number (a time in milliseconds, points)
        and `display` is how the title shows it. Public; with a bearer token the caller's own rows carry
        `me: true` and `around` holds their slice of the board when they are outside the top rows. Cached for 30 seconds.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: board, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionRanking" }
        "404": { description: No such title, no rankings for it, or no such board. }
        "502": { description: The title's backend did not answer. }
        "503": { description: Title pages are not configured on this deployment. }
  /companion/titles/{slug}/stats:
    get:
      summary: The signed-in player's stats for a title
      description: |
        A card of headline figures (`stats`) and a list (`rows`), the same shape for a game's own stats and for
        trophies. `linked` is false when the account has no identity on the title's network yet; then the lists are empty.
        The `key` of a stat is a stable id the client translates.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such title, or it has no stats. }
        "502": { description: The title's backend did not answer. }
        "503": { description: Title pages are not configured on this deployment. }
  /companion/titles/{slug}/listings:
    get:
      summary: A title's public listings
      description: |
        What players have put up for the title (for Pokémon, the open Global Trade Station listings), as a card:
        `stats` are headline figures and `rows` the listings. Species are PKHeX ids; the service reports no names.
        Public; cached for 15 seconds.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCard" }
        "404": { description: No such title, or it has no listings. }
        "502": { description: The title's backend did not answer. }
        "503": { description: Title pages are not configured on this deployment. }
  /me/trophies:
    get:
      summary: PlayStation 3 trophies
      description: |
        The trophies the signed-in account has earned, from the PS3 trophy service, as a card: `stats` are the totals
        (`trophies.total`, `trophies.points`, `trophies.platinum|gold|silver|bronze`), `rows` one per game by its
        communication id with the count earned and the date of the latest. The service stores unlocks only, so there
        are no trophy names, icons or per-game totals. `heading` is the linked PSN online id; `linked` is false when
        there is neither a link nor a trophy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: The trophy service did not answer. }
        "503": { description: Trophies are not configured on this deployment. }
  /me/activity:
    get:
      summary: Play activity
      description: |
        What the signed-in account has played, from the account core's play log: one entry per title and network,
        newest first, with time played, sessions and first and last played. The core keeps it for every account;
        it holds at most the 20 most recent titles per network. `title` is empty for a title the catalogue does not
        know. Per-day usage of supervised consoles is `GET /me/parental-controls/{moonID}/activity`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayActivity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: The core cannot be reached, or play history is not configured. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from POST /token.
    catalogKey:
      type: http
      scheme: bearer
      description: WEBSITE_CATALOG_KEY, for the catalog write routes only. Unset, no key works.
    adminSession:
      type: apiKey
      in: cookie
      name: opak_session
      description: A signed-in admin (WEBSITE_ADMIN_ACCOUNT_IDS), with the page's CSRF token as X-CSRF-Token.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: WEBSITE_INTERNAL_KEY, shared with nx-baas; service to service only.
  responses:
    SavesUnavailable:
      description: Cloud saves are not available on this deployment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SavesError:
      description: The saves service failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeletionPending:
      description: The password is right but the account is closed; it can be restored until erase_after.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [account_deletion_pending] }
              deletion_pending: { type: boolean }
              erase_after: { type: string, format: date-time }
    TwoFactorLocked:
      description: Too many wrong codes; the second factor is locked for 15 minutes.
      headers:
        Retry-After:
          schema: { type: integer, examples: [900] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Rewards:
      type: object
      description: The Rewards screens; see GET /me/rewards. Tiles, groups and entries carry worded text and site-path pictures.
      properties:
        balance: { type: integer }
        frozen: { type: boolean }
        paused: { type: boolean }
        showcase_public: { type: boolean }
        today_points: { type: integer }
        today_cap: { type: integer }
        today_percent: { type: integer }
        cap_reached: { type: boolean }
        more: { type: integer }
        play_time: { type: string }
        owned: { type: integer }
        ready: { type: integer }
        affordable: { type: integer }
        next_kind: { type: string, description: "claim, buy or play; absent when there is nothing to suggest." }
        next_text: { type: string }
        badge: { type: object, additionalProperties: true, description: The equipped badge, shown beside the balance. }
        slots: { type: array, items: { type: object, additionalProperties: true } }
        ready_tiles: { type: array, items: { type: object, additionalProperties: true } }
        tiles: { type: array, items: { type: object, additionalProperties: true } }
        done: { type: array, items: { type: object, additionalProperties: true } }
        ledger: { type: array, items: { type: object, additionalProperties: true } }
        shop: { type: array, items: { type: object, additionalProperties: true }, description: Shelves by kind; unowned items only. }
        upcoming: { type: array, items: { type: object, additionalProperties: true }, description: "Seasonal items before their date (Coming soon cards)." }
        mine: { type: array, items: { type: object, additionalProperties: true }, description: My items by kind. }
    RankingsBoard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [time, score, rating] }
        order: { type: string, enum: [asc, desc] }
        unit: { type: string }
        season: { type: string }
        has_scores: { type: boolean }
    RankingsRow:
      type: object
      properties:
        rank: { type: integer }
        account_id: { type: string }
        name: { type: string }
        avatar: { type: string }
        score: { type: integer, format: int64 }
        display: { type: string }
        updated_at: { type: string, format: date-time }
    PakkaConversation:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    CompanionTitle:
      type: object
      required: [slug, name, console, status, features]
      properties:
        slug: { type: string, example: mario-kart-wii }
        name: { type: string }
        console: { type: string }
        status: { type: string }
        title_id: { type: string }
        features:
          type: array
          items: { type: string, enum: [rankings, stats, listings] }
    CompanionEntry:
      type: object
      required: [rank, name, value, display]
      properties:
        rank: { type: integer }
        name: { type: string }
        value: { type: integer, format: int64 }
        display: { type: string }
        region: { type: string }
        note: { type: string }
        me: { type: boolean }
    CompanionRanking:
      type: object
      required: [boards, board, label, entries]
      properties:
        boards:
          type: array
          items:
            type: object
            required: [id, label]
            properties: { id: { type: string }, label: { type: string } }
        board: { type: string }
        label: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/CompanionEntry" } }
        around: { type: array, items: { $ref: "#/components/schemas/CompanionEntry" } }
        updated: { type: string, format: date-time }
    CompanionCard:
      type: object
      required: [stats, rows, linked]
      properties:
        heading: { type: string }
        linked: { type: boolean }
        stats:
          type: array
          items:
            type: object
            required: [key, value, n]
            properties: { key: { type: string }, value: { type: string }, n: { type: integer, format: int64 } }
        rows:
          type: array
          items:
            type: object
            required: [title, percent]
            properties:
              title: { type: string }
              sub: { type: string }
              value: { type: string }
              percent: { type: integer, description: "0 to 100 for a progress bar; -1 for none." }
    PlayActivity:
      type: object
      required: [titles, total_seconds, sessions, networks]
      properties:
        total_seconds: { type: integer, format: int64 }
        sessions: { type: integer }
        networks: { type: array, items: { type: string } }
        titles:
          type: array
          items:
            type: object
            required: [network, title_id, title, sessions, seconds, first_played, last_played]
            properties:
              network: { type: string, description: "The core's network id: switch, wiiu, 3ds, wfc, xbox, x360, np." }
              title_id: { type: string }
              title: { type: string }
              icon: { type: boolean, description: "GET /titles/icon/{title_id} on the website draws it." }
              sessions: { type: integer }
              seconds: { type: integer, format: int64 }
              first_played: { type: string, format: date-time }
              last_played: { type: string, format: date-time }
    CatalogWrite:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [title, feature], description: "Create only." }
        name: { type: string }
        console: { type: string }
        category: { type: string }
        backend: { type: string }
        status: { type: string, enum: [live, working, beta, alpha, partial, planned, requestable, not-feasible] }
        notes: { type: string }
        sort: { type: integer, minimum: 0 }
        title_id: { type: string, pattern: "^[0-9A-Fa-f]{16}$|^$", description: "The console's title id; stored upper case, unique when set." }
        title_ids:
          type: array
          items: { type: string, pattern: "^[0-9A-Fa-f]{16}$" }
          description: "Every id the title has, one per region; replaces the list. title_id becomes the first. On PATCH, title_id alone replaces only the primary and \"\" clears them all. Each id names one title only."
        playability:
          type: object
          additionalProperties: { type: string, enum: [playable, ingame, menus, boots, nothing] }
          description: "PATCH only, and a merge: only the named clients change, an empty status deletes that client, and a client left out keeps what it had. The key is the client's name as the /titles grid spells it (Ryujinx, Eden, Citron, Cemu, Switch, \u2026); the lower-case form clients send in X-OpenPak-Client is accepted too. Any other word is 400."
    CatalogEntry:
      type: object
      properties:
        id: { type: integer, description: "Not in GET /catalog.json." }
        kind: { type: string }
        name: { type: string }
        console: { type: string }
        category: { type: string }
        backend: { type: string }
        status: { type: string }
        notes: { type: string }
        sort: { type: integer, description: "Not in GET /catalog.json." }
        title_id: { type: string, description: "16 hex digits, upper case; empty when unknown." }
        title_ids: { type: array, items: { type: string }, description: "Every id the title has (one per region), title_id first." }
        date_added: { type: string, format: date-time }
        last_updated: { type: string, format: date-time }
        playability:
          type: object
          additionalProperties: { type: string, enum: [playable, ingame, menus, boots, nothing] }
          description: "How far the game itself runs per client \u2014 a different axis from status, which is how far OpenPak serves its online play. Always present; {} when nothing is known. Only in GET /catalog.json and GET /titles."
    ConsoleIdentity:
      type: object
      required: [account_id, pid, username, nex_password, mii_name, mii_data, device_type]
      properties:
        account_id: { type: string }
        pid: { type: integer, format: int64 }
        username: { type: string, description: "The PNID." }
        friend_code: { type: string, description: "3DS only." }
        nex_password: { type: string }
        mii_name: { type: string }
        mii_data: { type: string, format: byte, description: "Base64 FFLStoreData." }
        device_type: { type: string }
        password_cache: { type: string, format: byte, description: "Base64 of the 32 account.dat cache bytes, when present." }
        country: { type: string, description: "NNAS country, e.g. US, when present." }
        language: { type: string, description: "e.g. en, when present." }
    SwitchFriend:
      type: object
      required: [pid, name, friend_code, presence]
      properties:
        pid: { type: integer, format: int64, description: "Switch PID (uint64 on the wire; may exceed 2^53 — parse as a big integer)." }
        account_id: { type: string, description: "The friend's OpenPak account id; empty when the PID has no OpenPak account." }
        name: { type: string, description: "Console nickname." }
        friend_code: { type: string, description: "SW-xxxx-xxxx-xxxx." }
        presence:
          type: object
          required: [status]
          properties:
            status: { type: integer, description: "The console's presence state as the game servers report it (0 offline)." }
            app_field: { type: string, description: "Game-defined presence payload." }
            app_id: { type: string, description: "Title id of the game being played, hex." }
    SwitchIdentity:
      type: object
      required: [pid, username, friend_code, baas_user_id, token, friends, requests]
      properties:
        pid: { type: integer, format: int64, description: "Switch PID (uint64 on the wire; may exceed 2^53)." }
        username: { type: string, description: "Console nickname." }
        friend_code: { type: string, description: "SW-xxxx-xxxx-xxxx." }
        baas_user_id: { type: string, description: "BaaS user id, hex." }
        token: { type: string, description: "The openpak token title servers use to identify the player." }
        friends: { type: array, items: { $ref: "#/components/schemas/SwitchFriend" } }
        requests: { type: array, items: { $ref: "#/components/schemas/SwitchFriend" }, description: "Pending incoming friend requests." }
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Opaque bearer value; store securely, never log it.
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        message: { type: string }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge]
      properties:
        two_factor_required: { type: boolean, const: true }
        challenge:
          type: string
          description: Single use, valid 10 minutes, burned after 5 wrong codes.
    BlockedAccount:
      type: object
      required: [account_id, display_name, blocked_at]
      properties:
        account_id: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, description: "The account's picture, a site path (/media/avatars/<id>/256?v=...). Every account has one." }
        blocked_at: { type: string, format: date-time }
    NewsArticle:
      type: object
      required: [slug, title, summary, body, published_at]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string, description: The first paragraph of the body. }
        body: { type: string, description: Plain text; paragraphs are separated by a blank line. }
        published_at: { type: string, format: date-time }
    NetworkProfile:
      type: object
      description: |
        PRD prds/network-profile-service-prd.md §4. `version` is for humans and logs;
        the ETag is the machine's answer. `recheck_after` is a hint the
        client may honour or ignore. Validation before applying is the
        client's job: reject the whole profile unless it arrived over HTTPS
        from openpak.org and every entry sits inside the compiled-in
        allowlist.
      required: [version, generated_at, platform, server, redirect, services, recheck_after]
      properties:
        version: { type: integer, description: Monotonic; bumps when anything below changes. }
        generated_at: { type: integer, description: Unix seconds. }
        platform:
          type: string
          description: The requested platform, or "all" for the union.
        server:
          type: object
          required: [address, https_port, http_port]
          properties:
            address: { type: string, description: What a redirected name resolves to. }
            https_port: { type: integer }
            http_port: { type: integer }
        ca:
          type: [object, "null"]
          description: Absent when no CA is available; the client keeps the one it pinned.
          properties:
            url: { type: string }
            sha256: { type: string, description: Hex digest of the PEM at ca.url. }
            not_after: { type: integer, description: Unix seconds; CA expiry. }
        redirect:
          type: object
          required: [suffixes, exact, never]
          properties:
            suffixes:
              type: array
              items: { type: string }
              description: Domain families to redirect; a subset of the client's compiled-in families.
            exact:
              type: array
              items: { type: string }
              description: Names outside every listed suffix family.
            never:
              type: array
              items: { type: string }
              description: Names that must reach the real internet — a connection test pointed at OpenPak measures OpenPak.
        services:
          type: array
          description: For clients that address a URL rather than resolve a name (Cemu). DNS-redirecting clients ignore it.
          items:
            type: object
            required: [id, url]
            properties:
              id: { type: string }
              url: { type: string }
        recheck_after: { type: integer, description: "Seconds; a hint, not a contract." }
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: "English, for logs; show the code's translation instead." }
        code:
          type: string
          description: |
            Stable identifier for clients to translate. Unknown codes may be added; treat one
            like its HTTP status.
          enum: [handle_taken, handle_invalid, handle_reserved, handle_profane, account_suspended, attachment_too_large, attachments_unavailable, avatar_invalid, avatars_unavailable, bad_request, challenge_expired, chat_blocked, chat_not_friends, chat_unavailable, conflict, console_taken, forbidden, friend_code_unknown, friend_conflict, friend_self, internal, invalid_credentials, link_expired, no_pending_request, not_found, not_votable, quota_exceeded, rate_limited, registrations_closed, saves_unavailable, service_unavailable, session_expired, tickets_unavailable, too_large, two_factor_locked, two_factor_required, unauthorized, voice_room_full, voice_room_unknown, wfc_not_found, wfc_unavailable, wrong_code, wrong_password]
    CrashMeta:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [ryujinx, citron, eden, nro, app] }
        version: { type: string, maxLength: 200, description: The reporting program's version. }
        os: { type: string, maxLength: 200 }
        title_id: { type: string, maxLength: 200, description: The running game's title id, when there is one. }
        error_code: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 16000 }
        fields:
          type: object
          additionalProperties: true
          description: Anything else worth keeping (64 KiB at most). `top_frame`, or `stack` / `backtrace`, decide the grouping.
    CrashReceipt:
      type: object
      required: [id, signature, attachment]
      properties:
        id: { type: integer, format: int64, description: Quote it in a help ticket. }
        signature: { type: string, description: 16 hex digits naming the group this report joined. }
        attachment: { type: boolean, description: Whether a file was kept with it. }
    TicketInput:
      type: object
      required: [subject, category, message]
      properties:
        subject: { type: string, maxLength: 200 }
        category: { type: string, enum: [account, network, switch, wiiu-3ds, emulator, saves, app, other] }
        message: { type: string, maxLength: 20000 }
    Ticket:
      type: object
      required: [id, subject, category, status, messages, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        subject: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [open, waiting, closed]
          description: "open: waiting on the OpenPak team; waiting: answered, waiting on you; closed: done (a reply reopens it)."
        messages: { type: integer, description: Messages in the thread. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketMessage:
      type: object
      required: [id, from, body, created_at, attachment]
      properties:
        id: { type: integer, format: int64 }
        from: { type: string, enum: [you, staff] }
        body: { type: string }
        created_at: { type: string, format: date-time }
        attachment:
          oneOf:
            - type: "null"
            - type: object
              required: [name, size, url]
              properties:
                name: { type: string }
                size: { type: integer, format: int64 }
                url: { type: string, description: "Relative to the site, e.g. /api/v1/me/tickets/1/attachments/2; needs the bearer." }
    TicketThread:
      allOf:
        - { $ref: "#/components/schemas/Ticket" }
        - type: object
          required: [thread]
          properties:
            thread:
              type: array
              items: { $ref: "#/components/schemas/TicketMessage" }
    Account:
      type: object
      properties:
        account_id: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, description: "The account's picture, a site path (/media/avatars/<id>/256?v=...). Every account has one." }
        country: { type: string, description: Empty when the account has never set one. }
        birthday: { type: string, description: Empty when the account has never set one. }
        email: { type: string, description: "The account's email address; empty if the core could not be asked." }
        email_verified: { type: boolean, description: "False until the address is confirmed; POST /me/verify/resend sends the link again." }
        two_factor_enabled: { type: boolean }
        avatar_url:
          type: ['string', 'null']
          description: |
            Relative to the site. Null when the account has never chosen an
            avatar, so a client shows its own fallback rather than a broken
            image.
        friend_code:
          type: [string, "null"]
          description: |
            Present only when a Switch link exists: the code the adapter
            published on the link, else the adapter's own answer.
        friend_codes:
          type: array
          description: |
            Every code the account can be added by, in display order: OpenPak
            first, then Switch, Wii U (the NNID, once nn-account publishes it)
            and 3DS. Wii and DS have none (their codes are per game).
          items:
            type: object
            required: [kind, console, label, code]
            properties:
              kind: { type: string, enum: [handle, switch, 3ds, email] }
              console: { type: string, examples: ["3DS"] }
              label: { type: string, examples: ["Wii U · NNID"] }
              code: { type: string, examples: ["0123-4567-8901"] }
        handle:
          type: string
          description: |
            The account's permanent handle: add a friend by it on
            the website or the app, whatever console either of you has.
        linked_platforms:
          type: array
          items:
            type: object
            properties:
              namespace: { type: string }
              link_id: { type: string }
    VoiceRoom:
      type: object
      properties:
        code: { type: string, description: Six characters from A-Z and 2-9 without I and O. }
        kind: { type: string, enum: [game, code] }
        title: { type: string, description: The title server's name for the game (game rooms). }
        max_members: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              account_id: { type: string }
              display_name: { type: string }
              avatar_url: { type: string, description: "The account's picture, a site path (/media/avatars/<id>/256?v=...). Every account has one." }
              in_voice: { type: boolean }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        from_account: { type: string }
        to_account: { type: string }
        kind: { type: string }
        body: { type: string }
        sent_at_unix: { type: integer, format: int64 }
    SaveVersion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer }
        base: { type: integer }
        conflict: { type: boolean }
        pinned: { type: boolean }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        console: { type: string, enum: [Harbor, Switch], description: Which console made the backup. Never a device id. }
        backend: { type: string }
        parts: { type: integer }
        saved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Save:
      type: object
      properties:
        platform: { type: string }
        title_id: { type: string }
        name: { type: string, description: "The game's name, or the title id when unknown." }
        icon: { type: string, description: A path on this site; absent when there is no icon. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/SaveVersion" }
    SaveUsage:
      type: object
      properties:
        allowance_used: { type: integer, format: int64 }
        allowance: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    SaveStorage:
      type: object
      properties:
        connected: { type: boolean }
        kind: { type: string }
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        access_key: { type: string }
        path_style: { type: boolean }
        insecure: { type: boolean }
        url: { type: string, description: WebDAV. }
        username: { type: string, description: WebDAV. }
        account: { type: string, description: "Google Drive / OneDrive, the address the provider reported." }
        last_test_at: { type: [string, "null"], format: date-time }
        last_test_ok: { type: [boolean, "null"] }
        last_error: { type: string }
        move_state: { type: string }
        usage: { $ref: "#/components/schemas/SaveUsage" }
    Session:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Friend:
      type: object
      required: [account_id, display_name, online]
      properties:
        account_id: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, description: "The account's picture, a site path (/media/avatars/<id>/256?v=...). Every account has one." }
        online:
          type: boolean
          description: |
            Whether this friend holds a live session right now. Presence is
            derived from that session's lease, so it cannot drift out of step
            with it. The remaining fields are present only when `online` is
            true; presence is best-effort, and a friends list still loads with
            everyone shown offline if presence cannot be read.
        title_id:
          type: string
          description: What they are playing. Absent when the adapter registered no title.
        namespace:
          type: string
          description: The adapter the live session belongs to, e.g. `switch`.
          examples: ["switch"]
        since:
          type: string
          format: date-time
          description: When the session was registered.
        platform:
          type: string
          description: The console family, the same value as `namespace` (`switch`, `wiiu`, `3ds`).
        client:
          type: string
          description: |
            What the session runs on inside the platform: `switch`, `ryujinx`, `eden`, `citron`,
            `wiiu`, `3ds`, `cemu`, `azahar`. Empty when the adapter could not tell.
        label:
          type: string
          description: |
            Display name of the client, or of the platform when the client is unknown:
            `Switch`, `Ryujinx`, `Eden`, `Citron`, `Wii U`, `3DS`, `Cemu`, `Azahar`. Show
            "<title_name> on <label>", or "Online on <label>" when there is no title.
        title_name:
          type: string
          description: The title's name from the catalogue; empty when there is no title or nobody knows its name.
        presence:
          type: object
          description: The same presence fields again in one object (title_id, namespace, since, platform, client, label, title_name).
      examples:
        - account_id: "3f1c…"
          display_name: "Leia"
          online: true
          title_id: "0100E65002BB8000"
          namespace: "switch"
          since: "2026-09-08T09:15:00Z"
          platform: "switch"
          client: "ryujinx"
          label: "Ryujinx"
          title_name: "Stardew Valley"
          presence:
            title_id: "0100E65002BB8000"
            namespace: "switch"
            since: "2026-09-08T09:15:00Z"
            platform: "switch"
            client: "ryujinx"
            label: "Ryujinx"
            title_name: "Stardew Valley"
    Invitation:
      type: object
      required: [invitation_id, from, title_id, namespace, expires_at]
      properties:
        invitation_id: { type: string }
        from:
          type: string
          description: Display name of the account that sent it.
        title_id: { type: string }
        namespace: { type: string, examples: ["switch"] }
        expires_at: { type: string, format: date-time }
      description: |
        Deliberately carries no payload and no nonce: both belong to the adapter
        that has to deliver the invitation to a console, and reading this inbox
        never consumes an invitation or interferes with that delivery.
    ParentalDevice:
      type: object
      required: [moon_id, paired, has_setting]
      properties:
        moon_id:
          type: string
          description: The device id the console spells in its own paths, 16 hex digits.
        paired:
          type: boolean
          description: True once a console has claimed the record.
        pairing_code:
          type: string
          description: Present only while the code is still live.
        expires_at: { type: integer, format: int64, description: Unix seconds; with pairing_code. }
        activated_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        owners:
          type: array
          items: { type: string }
          description: |
            Nintendo-Account-shaped ids, learned when the console links an owner.
            Not the OpenPak account that manages the record, which is never sent
            to a console.
        has_setting:
          type: boolean
          description: Whether a parental_control_setting document has been stored yet.
        nickname:
          type: string
          description: |
            The name to show: the parent's (`named`), else "Switch ···" and the
            last four of the serial number, else empty. The console never sends
            a name.
        named: { type: boolean, description: True when the parent chose the name. }
        serial_number: { type: string, description: As the console reported it at pairing; may be empty. }
        firmware: { type: string, description: The console's system version at pairing; may be empty. }
        setting:
          type: object
          additionalProperties: true
          description: |
            The parental_control_setting document as it is served to the console,
            in the console's parse-table shape (docs repo,
            switch/parental-controls-firmware-2026-09-26.md §5b).
        players:
          type: array
          items:
            type: object
            required: [id, nickname]
            properties:
              id: { type: string }
              nickname: { type: string }
        synced_at: { type: integer, format: int64, description: Unix seconds of the console's last sync receipt; 0 if none. }
        synced: { type: boolean, description: True when that receipt names the document currently served. }
        wrong_pin_attempts:
          type: array
          items: { type: integer, format: int64 }
          description: When a wrong PIN was typed on the console, unix seconds, newest first, at most 20.
    ParentalPairing:
      type: object
      required: [moon_id, pairing_code, expires_at]
      properties:
        moon_id: { type: string }
        pairing_code: { type: string }
        expires_at: { type: integer, format: int64, description: Unix seconds. }
    DeclineBody:
      type: object
      required: [invitation_id]
      properties:
        invitation_id: { type: string }
    AccountIDBody:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }
