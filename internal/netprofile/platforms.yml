# The per-platform network map: the only authored input to the network
# profile (PRD prds/network-profile-service-prd.md §5). Everything else is derived
# from what this server already routes:
#
#   source 1  Traefik's dynamic config (NETPROFILE_TRAEFIK_FILE) — the
#             authoritative list of names this network answers on. A routed
#             name must be claimed by at least one platform below, either by
#             one of its families or by its exact list; internal/drift_test
#             fails the build when one is not.
#   source 2  The signed redirect ceiling (docs/signed-ceiling.md), served at
#             /api/v1/network/ceiling from NETPROFILE_CEILING_FILE. A family
#             here must lie inside its platform's signed ceiling; one outside
#             is dropped from the profile on its own and logged, and
#             drift_test fails against testdata/netprofile-ceiling.json.
#             Adding a family: `openpak-policy ceiling add` first, then here.
#
# This file changes rarely and is reviewed like code. Adding a title needs no
# edit here: the title's HostSNI lands in Traefik, its name ends in a family
# every Switch client already redirects, and the profile picks it up.
#
# Rules the review enforces:
#   - The server may narrow, never widen. A family listed here is a subset of
#     what the console family's clients compile in; anything more is a
#     redirect of somebody else's traffic.
#   - never lists names that must reach the real internet. A connection test
#     pointed at OpenPak measures OpenPak, not the player's internet.

public_base_url: https://openpak.org

server:
  address: 145.241.199.19      # what a redirected name resolves to (the box)
  https_port: 443              # consoles cannot be told a port; this is for clients that can
  http_port: 80

recheck_after: 21600           # a hint, not a contract (6h)

platforms:
  switch:
    # Everything the console reaches goes to OpenPak, not to the service that
    # would refuse it. NPLN, NEX, BAAS, dauth, Penne and BCAT live under
    # nintendo.net; accounts under nintendo.com; the connection test under
    # nintendowifi.net, which OpenPak answers as a service of its own rather
    # than leaving the console to measure somebody else's internet.
    #
    # The rest are third parties a title dials with no Nintendo host in the
    # path. OpenPak answers on Battle.net, Photon and Among Us. It answers on
    # none of the others yet, and they are here anyway: each asks Nintendo to
    # vouch for a token an OpenPak console does not have, so the connection was
    # going to be refused. Failing to connect and failing to authenticate cost
    # the player the same thing, and this way the console never talks to them.
    #
    # Nothing here is a guess: every family covers a name observed coming off a
    # console or an emulator on a dated run. See
    # console/openpak-nro/docs/researched-hosts.md for the per-host record.
    families:
      - ".nintendo.net"
      - ".nintendo.com"
      - ".nintendowifi.net"
      - ".battle.net"
      - ".among.us"
      - ".photonengine.io"
      - ".exitgames.com"
      - ".demonware.net"
      - ".epicgames.dev"
      - ".ea.com"
      - ".xboxlive.com"
      - ".live.com"
      - ".mojang.com"
      - ".microsoft.com"
      # Klei's own stack: Don't Starve Together reaches no Nintendo service beyond its BAAS
      # account, and servers/klei answers the login and the lobby browser. The content tier
      # (galette) is in `never` below -- it serves the game's own data and it works.
      - ".klei.com"
      - ".kleientertainment.com"
    exact: []                  # every name this platform claims is inside a family above
    overrides:
      # The NAT check probes two addresses from one socket and decides the
      # console's NAT type from what each of them saw. Both probes collapsing
      # onto the server address is a NAT type it cannot determine, so the
      # second responder is named its own box here.
      "nncs2-lp1.n.n.srv.nintendo.net": "145.241.228.207"
    never:
      # Klei's content delivery. Redirecting it would take the game's own patch data away from
      # it for no gain: it needs no account, and it answers an OpenPak console today.
      - "galette.klei.com"
      - "cdn-galette.klei.com"
    services: {}               # Switch clients resolve names; nothing addresses a URL

  wiiu:
    families: [".nintendo.net", ".nintendowifi.net", ".openpak.org"]
    never: ["conntest.nintendowifi.net"]
    # Cemu addresses URLs, not names: the ten entries its OpenPakURLs struct
    # carries today (emulators/cemu src/config/NetworkSettings.h). The struct
    # stays as the compiled-in fallback; these replace it when a profile
    # arrives. Every host must end in one of the families above.
    services:
      act:    "https://account.openpak.org"
      ecs:    "https://ecs.wup.shop.openpak.org/ecs/services/ECommerceSOAP"
      nus:    "https://nus.wup.shop.openpak.org/nus/services/NetUpdateSOAP"
      ias:    "https://ias.wup.shop.openpak.org/ias/services/IdentityAuthenticationSOAP"
      ccsu:   "https://ccs.wup.shop.openpak.org/ccs/download"
      ccs:    "http://ccs.cdn.wup.shop.openpak.org/ccs/download"
      idbe:   "https://idbe-wup.cdn.openpak.org/icondata"
      boss:   "https://npts.app.openpak.org/p01/tasksheet"
      tagaya: "https://tagaya.wup.shop.openpak.org/tagaya/versionlist"
      olv:    "https://discovery.olv.openpak.org/v1/endpoint"

  3ds:
    families: [".nintendo.net", ".nintendowifi.net", ".openpak.org"]
    never: ["conntest.nintendowifi.net"]
    services: {}               # Azahar takes names from redirect.*, not URLs

  wii:
    # WFC: the NAS front and the GameSpy back (sake/gamestats/race) live
    # under nintendowifi.net; a few titles speak gamespy.com directly; the
    # patched Wii client uses the openpak.org aliases.
    families: [".nintendowifi.net", ".gamespy.com", ".openpak.org"]
    never: ["conntest.nintendowifi.net"]
    services: {}

  ds:
    families: [".nintendowifi.net", ".gamespy.com", ".openpak.org"]
    never: ["conntest.nintendowifi.net"]
    services: {}
