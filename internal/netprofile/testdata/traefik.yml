# Wii U / 3DS: the adapter speaks plain HTTP, so Traefik terminates TLS for these names with
# a leaf signed by the OpenPak CA (certs/wiiu.pem). Everything else stays SNI passthrough.
http:
  routers:
    among-us:
      entryPoints: [console]
      rule: "Host(`matchmaker.among.us`) || Host(`matchmaker-eu.among.us`) || Host(`matchmaker-as.among.us`)"
      service: among-us
      tls: {}
    nn-account:
      entryPoints: [console]
      rule: "Host(`account.nintendo.net`) || Host(`nasc.nintendowifi.net`) || Host(`cbvc.cdn.nintendo.net`) || Host(`account.openpak.org`) || Host(`nasc.openpak.org`) || Host(`cbvc.cdn.openpak.org`)"
      service: nn-account
      tls: {}
    conntest-tls:
      entryPoints: [console]
      rule: "Host(`conntest.nintendowifi.net`) || Host(`conntest.openpak.org`)"
      middlewares: [conntest-root]
      service: nn-account
      tls: {}
    nn-juxtaposition-api:
      entryPoints: [console]
      rule: "Host(`api.olv.nintendo.net`) || Host(`discovery.olv.nintendo.net`) || Host(`api.olv.openpak.org`) || Host(`discovery.olv.openpak.org`)"
      service: nn-juxtaposition-api
      tls: {}
    nn-juxtaposition-ui:
      entryPoints: [console]
      rule: "Host(`portal.olv.nintendo.net`) || Host(`ctr.olv.nintendo.net`) || Host(`portal.olv.openpak.org`) || Host(`ctr.olv.openpak.org`)"
      service: nn-juxtaposition-ui
      tls: {}
    nn-boss:
      entryPoints: [console]
      rule: 'Host(`npdi.cdn.nintendowifi.net`) || Host(`npdl.cdn.nintendowifi.net`) || Host(`npfl.c.app.nintendowifi.net`) || Host(`nppl.app.nintendowifi.net`) || Host(`npts.app.nintendowifi.net`) || Host(`service.spotpass.nintendowifi.net`) || HostRegexp(`^(npdi|npdl)\.cdn\.openpak\.org$`) || HostRegexp(`^(nppl|npts)\.app\.openpak\.org$`) || Host(`npfl.c.app.openpak.org`) || Host(`service.spotpass.openpak.org`)'
      service: nn-boss
      tls: {}
    nn-soap:
      entryPoints: [console]
      rule: 'Host(`ecs.wup.shop.nintendo.net`) || Host(`ias.wup.shop.nintendo.net`) || Host(`nus.wup.shop.nintendo.net`) || Host(`ccs.wup.shop.nintendo.net`) || Host(`ecs.c.shop.nintendowifi.net`) || Host(`ias.c.shop.nintendowifi.net`) || Host(`nus.c.shop.nintendowifi.net`) || Host(`ccs.c.shop.nintendowifi.net`) || HostRegexp(`^(ecs|ias|nus|ccs|cas|pushmo|pushmore|tagaya|pls)\.(wup|c)\.shop\.openpak\.org$`)'
      service: nn-soap
      tls: {}
    nn-wfc-nas:
      entryPoints: [web]
      rule: 'HostRegexp(`^(nas|naswii|dls1)\.nintendowifi\.net$`) || HostRegexp(`\.(sake|gamestats2?|race)\.gs\.nintendowifi\.net$`) || HostRegexp(`^(nas|naswii|dls1)\.openpak\.org$`) || HostRegexp(`\.gs\.openpak\.org$`) || HostRegexp(`\.(sake|gamestats2?|race)\.gs\.openpak\.org$`)'
      priority: 20
      service: nn-wfc-nas
    conntest-web:
      entryPoints: [web]
      rule: "Host(`conntest.nintendowifi.net`) || Host(`conntest.openpak.org`)"
      priority: 20
      middlewares: [conntest-root]
      service: nn-account
    cbvc-web:
      entryPoints: [web]
      rule: "Host(`cbvc.cdn.nintendo.net`) || Host(`cbvc.cdn.openpak.org`)"
      priority: 20
      service: nn-account
    nx-baas-web:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: nx-baas-http
  middlewares:
    conntest-root:
      replacePath:
        path: /conntest
  services:
    nn-account:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-account:20050"
    nn-juxtaposition-api:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-juxtaposition-api:20090"
    nn-juxtaposition-ui:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-juxtaposition-ui:20100"
    nn-boss:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-boss:20080"
    nn-soap:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-soap:20110"
    nn-wfc-nas:
      loadBalancer:
        servers:
          - url: "http://openpak-nn-wfc:20120"
    nx-baas-http:
      loadBalancer:
        servers:
          - url: "http://openpak-nx-baas:21080"
    among-us:
      loadBalancer:
        servers:
          - url: "http://openpak-among-us:22600"
tls:
  certificates:
    - certFile: /etc/traefik/certs/wiiu.pem
      keyFile: /etc/traefik/certs/wiiu.key
    - certFile: /etc/traefik/certs/amongus.pem
      keyFile: /etc/traefik/certs/amongus.key
