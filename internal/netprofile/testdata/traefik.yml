# TLS passthrough only: every backend terminates TLS with its own certificate, so Traefik
# just reads the SNI and splices the connection. Adding a title means adding a router here.
tcp:
  routers:
    news-experiment:
      entryPoints: [console]
      rule: "HostSNI(`bcat-topics-lp1.cdn.nintendo.net`)"
      priority: 1000
      service: news-experiment
      tls:
        passthrough: true
    stardew:
      entryPoints: [console]
      rule: "HostSNI(`t-9f607adf-lp1.lp1.t.npln.srv.nintendo.net`) || HostSNI(`gamesync.npln.nintendo.net`)"
      service: stardew
      tls:
        passthrough: true
    splatoon-3:
      entryPoints: [console]
      rule: "HostSNI(`t-dce9377b-lp1.lp1.t.npln.srv.nintendo.net`)"
