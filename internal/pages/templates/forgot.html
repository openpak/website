{{template "header" .}}
<div class="mx-auto w-full max-w-sm">
  <h1>{{t .Lang "auth.forgot.title"}}</h1>
  <p class="text-muted">{{t .Lang "auth.forgot.help"}}</p>
  <form method="post" action="/forgot-password" class="form-stack mt-6">
    <label for="email">{{t .Lang "auth.email"}}</label>
    <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    <button type="submit" class="btn primary">{{t .Lang "auth.forgot.send"}}</button>
  </form>
  <p class="mt-6 text-sm text-muted"><a href="/login">{{t .Lang "nav.signin"}}</a></p>
</div>
{{template "footer" .}}
