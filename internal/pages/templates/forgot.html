{{template "header" .}}
<div class="auth">
  <h1>{{t .Lang "auth.forgot.title"}}</h1>
  <p class="muted">{{t .Lang "auth.forgot.help"}}</p>
  <form method="post" action="/forgot-password" class="stack full">
    <label for="email">{{t .Lang "auth.email"}}</label>
    <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    <button type="submit" class="primary">{{t .Lang "auth.forgot.send"}}</button>
  </form>
  <p class="auth-alt"><a href="/login">{{t .Lang "nav.signin"}}</a></p>
</div>
{{template "footer" .}}
