{{template "header" .}}
<div class="auth">
  <h1>{{t .Lang "auth.login.title"}}</h1>
  <form method="post" action="/login" class="stack full">
    <label for="email">{{t .Lang "auth.email"}}</label>
    <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    <label for="password">{{t .Lang "auth.password"}}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="primary">{{t .Lang "nav.signin"}}</button>
  </form>
  <p class="auth-alt"><a href="/forgot-password">{{t .Lang "auth.forgot"}}</a> · <a href="/register">{{t .Lang "nav.register"}}</a></p>
</div>
{{template "footer" .}}
