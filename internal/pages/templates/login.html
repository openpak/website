{{template "header" .}}
<div class="mx-auto w-full max-w-sm">
  <h1>{{t .Lang "auth.login.title"}}</h1>
  <form method="post" action="/login" class="form-stack mt-6">
    {{with .Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
    <label for="email">{{t .Lang "auth.email"}}</label>
    <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    <label for="password">{{t .Lang "auth.password"}}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="btn primary">{{t .Lang "nav.signin"}}</button>
  </form>
  <p class="mt-6 text-sm text-muted"><a href="/forgot-password">{{t .Lang "auth.forgot"}}</a> · <a href="/register">{{t .Lang "nav.register"}}</a></p>
</div>
{{template "footer" .}}
