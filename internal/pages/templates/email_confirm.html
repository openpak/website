{{template "header" .}}
<div class="mx-auto w-full max-w-sm">
  <h1>{{t .Lang "auth.email.confirm.title"}}</h1>
  <p class="muted">{{t .Lang "auth.email.confirm.sub"}}</p>
  <form method="post" action="/email/confirm" class="form-stack mt-6">
    <input type="hidden" name="token" value="{{.Token}}">
    <button type="submit" class="btn primary">{{t .Lang "auth.email.confirm.submit"}}</button>
  </form>
</div>
{{template "footer" .}}
