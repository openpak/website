{{template "header" .}}
<div class="auth">
  <h1>{{t .Lang "auth.register.title"}}</h1>
{{if .Closed}}
  <p class="notice" role="alert">{{t .Lang "auth.register.closed"}}</p>
{{else}}
  <form method="post" action="/register" class="stack full">
    <label for="display_name">{{t .Lang "auth.displayname"}}</label>
    <input id="display_name" name="display_name" type="text" required maxlength="32" autocomplete="nickname" autofocus>
    <label for="email">{{t .Lang "auth.email"}}</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label for="password">{{t .Lang "auth.password"}}</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <label for="country">{{t .Lang "auth.country"}}</label>
    <select id="country" name="country" required autocomplete="country">
      {{range .Countries}}<option value="{{.Code}}">{{.Name}}</option>{{end}}
    </select>
    <label for="birthday">{{t .Lang "auth.birthday"}}</label>
    <input id="birthday" name="birthday" type="date" required max="{{.MaxBirthday}}" autocomplete="bday">
    <p class="hint">{{t .Lang "auth.profile.why"}}</p>
    <p class="hint">{{t .Lang "auth.remember"}}</p>
    <button type="submit" class="primary">{{t .Lang "nav.register"}}</button>
  </form>
  <p class="auth-alt"><a href="/login">{{t .Lang "nav.signin"}}</a> · <a href="/forgot-password">{{t .Lang "auth.forgot"}}</a></p>
{{end}}
</div>
{{template "footer" .}}
