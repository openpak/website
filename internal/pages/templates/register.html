{{template "header" .}}
<h1>{{t .Lang "auth.register.title"}}</h1>
{{if .Closed}}
<p role="alert">{{t .Lang "auth.register.closed"}}</p>
{{else}}
<form method="post" action="/register" class="stack">
  <label for="display_name">{{t .Lang "auth.displayname"}}</label>
  <input id="display_name" name="display_name" type="text" required maxlength="32" autocomplete="nickname">
  <label for="email">{{t .Lang "auth.email"}}</label>
  <input id="email" name="email" type="email" required autocomplete="email">
  <label for="password">{{t .Lang "auth.password"}}</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <p>{{t .Lang "auth.remember"}}</p>
  <button type="submit">{{t .Lang "nav.register"}}</button>
</form>
<p><a href="/login">{{t .Lang "nav.signin"}}</a> · <a href="/forgot-password">{{t .Lang "auth.forgot"}}</a></p>
{{end}}
{{template "footer" .}}
