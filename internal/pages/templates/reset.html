{{template "header" .}}
<div class="mx-auto w-full max-w-sm">
  <h1>{{t .Lang "auth.reset.title"}}</h1>
  <form method="post" action="/reset-password" class="form-stack mt-6">
    <input type="hidden" name="token" value="{{.Token}}">
    <label for="password">{{t .Lang "auth.password"}}</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" autofocus>
    <button type="submit" class="btn primary">{{t .Lang "auth.reset.save"}}</button>
  </form>
</div>
{{template "footer" .}}
