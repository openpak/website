name: release

# Tag a release (v1.2.3) and this publishes ghcr.io/openpak/<repo>:1.2.3, :1.2 and :latest for
# amd64 and arm64. Deployed hosts run podman-auto-update against :latest, so pushing a tag is
# the deploy. Runs on the OpenPak self-hosted runner (podman + qemu binfmt), so it costs no
# GitHub-hosted minutes; this repository is private and those are metered.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The pinned fetch tool of build-time integration (03, BUILD-009): pilot
  # release workflows download a tagged binary and verify its checksum, so
  # the tool's revision is part of every certified release's provenance.
  network-tool:
    runs-on: [self-hosted, linux, podman]
    permissions:
      contents: write # release assets only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: |
          set -e
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            os=${platform%/*}; arch=${platform#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/openpak-network-$os-$arch" ./cmd/openpak-network
          done
          # The services-page host agent (docs/opsd.md) rides along: Linux
          # only, since it drives podman and systemd --user.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/openpak-opsd-linux-$arch" ./cmd/openpak-opsd
          done
          (cd dist && sha256sum openpak-network-* openpak-opsd-* > checksums.txt)
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "openpak-network $GITHUB_REF_NAME" \
              --notes "Static openpak-network fetch tool builds; pin one via its checksums.txt (03 BUILD-009)."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  image:
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
      # REGISTRY_AUTH_FILE lives on the steps, not the job: the runner context
      # does not exist at job-env parse time, and a workflow that cannot parse
      # dispatches nothing — this is why v0.39.0's tag produced no run.
      - run: |
          set -e
          IMG="ghcr.io/${{ github.repository }}"
          case "${GITHUB_REF_NAME}" in v*) VER="${GITHUB_REF_NAME#v}";; *) VER="";; esac
          podman manifest rm "$IMG:build" 2>/dev/null || true
          podman build --platform linux/amd64,linux/arm64 --manifest "$IMG:build" .
          TAGS="latest"; [ -n "$VER" ] && TAGS="$TAGS $VER $(echo "$VER" | cut -d. -f1,2)"
          for t in $TAGS; do podman manifest push --all "$IMG:build" "docker://$IMG:$t"; done
          podman manifest rm "$IMG:build"
          echo "pushed $IMG: $TAGS"
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
