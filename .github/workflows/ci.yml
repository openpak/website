name: ci
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The account-core contracts come from the public github.com/openpak/account-api
      # module, so no sibling checkout is needed.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -race ./...
