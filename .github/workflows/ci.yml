name: ci
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The account-core contracts are vendored in internal/accountpb, so no
      # sibling checkout is needed (and a private cross-repo checkout would need
      # a PAT anyway). See internal/accountpb/README.md.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -race ./...
