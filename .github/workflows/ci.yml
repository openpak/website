name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The OpenPak self-hosted runner, like the release jobs: GitHub-hosted minutes are not
    # used for private repositories.
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v4
      # The account-core contracts are vendored in internal/accountpb, so no
      # sibling checkout is needed (and a private cross-repo checkout would need
      # a PAT anyway). See internal/accountpb/README.md.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -race ./...
