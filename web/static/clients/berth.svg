<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Berth: an anchor whose ring frames a boat tied up at dawn">
<!-- SPDX-FileCopyrightText: 2026 tobagin -->
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <!-- Original Berth artwork, sibling of the Harbor, Wharf and Pier icons. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="158" x2="0" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3a6b"/>
      <stop offset="0.55" stop-color="#e8908a"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="300" cy="282" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd36e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="60" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a5d7a"/>
      <stop offset="1" stop-color="#1f2b40"/>
    </linearGradient>
    <clipPath id="window"><circle cx="256" cy="256" r="98"/></clipPath>
  </defs>
  <g transform="translate(0 -18)">
    <!-- shadow -->
    <g opacity="0.16" transform="translate(0 10)" fill="#0a1426" stroke="#0a1426">
      <circle cx="256" cy="196" r="100" stroke-width="28" fill="none"/>
      <rect x="239" y="290" width="34" height="160" stroke="none"/>
      <path d="M126,376 Q256,512 386,376" fill="none" stroke-width="30"/>
    </g>
    <!-- arms and flukes -->
    <path d="M126,376 Q256,512 386,376" fill="none" stroke="url(#iron)" stroke-width="30" stroke-linecap="round"/>
    <path d="M100,388 L118,330 L150,384 Z" fill="#2b3a52"/>
    <path d="M412,388 L394,330 L362,384 Z" fill="#2b3a52"/>
    <path d="M118,330 L126,348 L108,370 Z" fill="#4a5d7a"/>
    <path d="M394,330 L386,348 L404,370 Z" fill="#4a5d7a"/>
    <!-- shank -->
    <rect x="239" y="290" width="34" height="168" rx="6" fill="url(#iron)"/>
    <rect x="244" y="294" width="7" height="150" rx="3.5" fill="#ffffff" opacity="0.15"/>
    <circle cx="256" cy="452" r="22" fill="#2b3a52"/>
    <!-- rope wrapped around the shank -->
    <g fill="#e3c79a" stroke="#b8915e" stroke-width="2">
      <rect x="230" y="352" width="52" height="11" rx="5.5" transform="rotate(-12 256 357)"/>
      <rect x="230" y="368" width="52" height="11" rx="5.5" transform="rotate(-12 256 373)"/>
      <rect x="230" y="384" width="52" height="11" rx="5.5" transform="rotate(-12 256 389)"/>
    </g>
    <path d="M232,398 C200,420 196,450 222,470" fill="none" stroke="#e3c79a" stroke-width="9" stroke-linecap="round"/>
    <!-- stock -->
    <rect x="166" y="300" width="180" height="24" rx="12" fill="url(#iron)"/>
    <circle cx="166" cy="312" r="16" fill="#2b3a52"/>
    <circle cx="346" cy="312" r="16" fill="#2b3a52"/>
    <rect x="176" y="303" width="160" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
    <!-- ring frame + view -->
    <circle cx="256" cy="196" r="100" fill="none" stroke="url(#iron)" stroke-width="28"/>
    <circle cx="256" cy="196" r="113" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
    <g transform="translate(256 196) scale(0.88) translate(-256 -256)">
  <g clip-path="url(#window)">
    <rect x="158" y="158" width="196" height="124" fill="url(#sky)"/>
    <circle cx="300" cy="282" r="64" fill="url(#sunglow)"/>
    <circle cx="300" cy="282" r="22" fill="#fff1c4"/>
    <path d="M150,282 C170,268 190,262 212,266 C226,268 238,274 252,282 Z" fill="#6a6596"/>
    <path d="M206,206 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="#2b3a6b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="158" y="282" width="196" height="72" fill="#3f6fa3"/>
    <rect x="286" y="288" width="30" height="3" rx="1.5" fill="#ffe3a3" opacity="0.8"/>
    <rect x="292" y="294" width="18" height="3" rx="1.5" fill="#ffe3a3" opacity="0.5"/>

    <!-- moored boat -->
    <rect x="320.5" y="256" width="2.5" height="30" fill="#22344f"/>
    <rect x="288" y="280" width="28" height="18" rx="3" fill="#fff6ea"/>
    <rect x="293" y="284" width="7" height="6" rx="1.5" fill="#3f6fa3"/>
    <rect x="304" y="284" width="7" height="6" rx="1.5" fill="#3f6fa3"/>
    <path d="M262,296 H346 L334,318 H274 Z" fill="#ff6f61"/>
    <rect x="266" y="300" width="76" height="4" fill="#fff6ea"/>

    <!-- back wave, in front of the hull -->
    <path d="M150,314 Q165,306 180,314 T210,314 T240,314 T270,314 T300,314 T330,314 T360,314 V354 H150 Z" fill="#2a9db3"/>

    <!-- the berth: dock, pilings, bollard and mooring line -->
    <rect x="150" y="318" width="100" height="10" fill="#8a5a3c"/>
    <rect x="150" y="318" width="100" height="3" fill="#b47a4f"/>
    <g fill="#5e3a24">
      <rect x="166" y="328" width="7" height="26"/>
      <rect x="196" y="328" width="7" height="26"/>
      <rect x="226" y="328" width="7" height="26"/>
    </g>
    <rect x="214" y="304" width="16" height="14" rx="3" fill="#22344f"/>
    <rect x="210" y="300" width="24" height="6" rx="3" fill="#22344f"/>
    <path d="M226,305 Q248,316 266,298" fill="none" stroke="#e3c79a" stroke-width="2.5"/>

    <!-- front wave -->
    <path d="M150,338 Q165,330 180,338 T210,338 T240,338 T270,338 T300,338 T330,338 T360,338 V354 H150 Z" fill="#59decf"/>
  </g>
    </g>
    <circle cx="256" cy="196" r="86.5" fill="none" stroke="#142640" stroke-width="4"/>
  </g>
</svg>
